  const {a} = abilityOf(e, slot);
  return (e.cds[slot]||0) <= now() && e.nrg >= (a.cost||0) && !hasFx(e,"stun") && !e.dead;
}
function fwd(e){ return {x:Math.sin(e.yaw), z:Math.cos(e.yaw)}; }

const COMBO_WINDOW = 760;
const COMBO_MUL  = [1.00, 1.12, 1.62];
const COMBO_KNOCK= [1.00, 1.20, 2.60];
function useAbility(e, slot){
  let {a} = abilityOf(e, slot);
  if(!ready(e, slot)) return false;
  e.cds[slot] = now() + a.cd / (e.enrage || 1);
  e.nrg -= (a.cost||0);
  e.swingT = now();
  const f = fwd(e);
  const o = {knock:a.knock, bleed:a.bleed, burn:a.burn, weaken:a.weaken, mark:a.mark,
             stun:a.stun, drain:a.drain, pierce:a.pierce};
  /* three light strikes run together; the third one lands properly */
  const arank = (e.team==="you") ? abilLevel(e.id, slot) : 0;
  if(arank) e.cds[slot] = now() + a.cd * (1 - arank*0.06);
  let mul = a.mul * (1 + arank*0.09), step = 0;
  if(slot === "light"){
    step = (now() - (e.comboT||0) < COMBO_WINDOW) ? ((e.comboStep||0)+1) % 3 : 0;
    e.comboStep = step; e.comboT = now();
    mul = mul * COMBO_MUL[step];
    if(o.knock) o.knock *= COMBO_KNOCK[step];
    if(step === 2){ o.knock = (o.knock||120)*1.2; e.cds.light = now() + a.cd*1.6; }
  }
  a = Object.assign({}, a, {mul});

  switch(a.kind){
    case "swipe": {
      const reach = reachOf(a) + e.rad;
      coneHit(e, reach, a.arc, mul, o);
      splashCars(e, e.x + f.x*reach*0.7, e.z + f.z*reach*0.7, reach*0.6);
      G.arcs.push({e, r:reach, t:0, life:180, c:e.pal.c3, yaw:e.yaw});
      SFX.swing(e);
      break;
    }
    case "shot":   shoot(e, e.yaw, 0, a, o); SFX.shot(e); break;
    case "spread":
      for(let i=0;i<a.count;i++) shoot(e, e.yaw + (i-(a.count-1)/2)*(a.arc/Math.max(1,a.count-1)), 0, a, o);
      SFX.shot(e);
      break;
    case "beam": {
      const len = a.len*U_LEN, wid = a.wid*U_WID;
      G.beams.push({x:e.x, y:e.y+e.height*0.62, z:e.z, yaw:e.yaw, len, wid, c:e.pal.c3, t:0, life:210});
      rayHit(e, len, wid, mul, o);
      for(let s2=0;s2<4;s2++) splashCars(e, e.x+f.x*len*(s2+1)/4, e.z+f.z*len*(s2+1)/4, wid);
      SFX.beam(e);
      G.shake += .22;
      break;
    }
    case "slam": {
      const R = a.radius*U_RADIUS;
      shock(e.x, e.y+0.3, e.z, R, e.pal.c3, 420);
      sphereHit(e, e.x, e.y, e.z, R, mul, o);
      splashCars(e, e.x, e.z, R);
      SFX.slam(e.x, e.z, R);
      burst(e.x, e.y+0.6, e.z, 22, e.pal.c3);
      G.shake += Math.min(.85, R/16);
      break;
    }
    case "dash": {
      e.dashT = now()+260; e.dashHit = new Set(); e.dashMul = a.mul; e.dashOpts = o;
      e.dashSpeed = (a.dist*U_DIST)/0.26; e.dashYaw = e.yaw;
      setFx(e,"iframe",230);
      break;
    }
    case "blitz":  e.blitz  = {left:a.hits, mul:a.mul, opts:o, next:now()}; break;
    case "frenzy": e.frenzy = {left:a.hits, mul:a.mul, R:a.radius*U_RADIUS, opts:o, next:now()}; break;
    case "orbit":
      for(let i=0;i<a.count;i++)
        G.orbits.push({owner:e, ang:i*(6.283/a.count), rad:a.radius*U_RADIUS*1.5, mul:a.mul, t:0, life:a.dur, cool:{}});
      break;
    case "buff": {
      if(a.cleanse) ["burn","bleed","weaken","mark","stun"].forEach(k=>e.fx[k]=0);
      if(a.nrg) e.nrg = Math.min(e.maxNrg, e.nrg+a.nrg);
      if(a.random){ const ks=["charge","fortify","regen","haste","shield"];
        setFx(e, ks[Math.floor(Math.random()*ks.length)], 5000); }
      if(a.self) for(const k in a.self) setFx(e,k,a.self[k]);
      shock(e.x, e.y+0.2, e.z, 1.8, e.pal.c3, 420);
      break;
    }
    case "heal": {
      if(a.cleanse) ["burn","bleed","weaken","mark","stun"].forEach(k=>e.fx[k]=0);
      const h = Math.round(e.maxHp*a.heal);
      e.hp = Math.min(e.maxHp, e.hp+h);
      G.pops.push({x:e.x,y:e.y+e.height*1.05,z:e.z,txt:"+"+h,t:0,life:900,col:"#5FE39A",size:18});
      if(a.self) for(const k in a.self) setFx(e,k,a.self[k]);
      shock(e.x, e.y+0.2, e.z, 1.8, [.37,.89,.60], 420);
      break;
    }
  }
  return true;
}

function shoot(e, yaw, pitch, a, o){
  const wob = a.wobble ? (Math.random()-.5)*a.wobble : 0;
  const y = yaw + wob;
  const sp = a.speed*U_SPEED;
  G.projs.push({
    owner:e, team:e.team,
    x:e.x + Math.sin(y)*(e.rad+0.5), y:e.y + e.height*0.62, z:e.z + Math.cos(y)*(e.rad+0.5),
    vx:Math.sin(y)*sp, vy:Math.sin(pitch)*sp, vz:Math.cos(y)*sp,
    r:Math.max(0.14, a.r*0.036), life:a.life||900, t:0, mul:a.mul, c:e.pal.c3,
    pierce:a.pierce, home:a.home||0, hit:new Set(), opts:o
  });
}
function coneHit(e, reach, arc, mul, o){
  const f = fwd(e);
  for(const t of G.ents){
    if(!canHit(e,t)) continue;
    const dx=t.x-e.x, dz=t.z-e.z, d=Math.hypot(dx,dz);
    if(d > reach + t.rad) continue;
    if(Math.abs(t.y - e.y) > 2.0) continue;
    if(d>0.01 && (dx/d*f.x + dz/d*f.z) < Math.cos(arc/2)) continue;
    dealDamage(e,t,mul,o);
  }
}
function sphereHit(e, x,y,z, R, mul, o){
  for(const t of G.ents){
    if(!canHit(e,t)) continue;
    if(Math.hypot(t.x-x, (t.y+t.height*.5)-(y+0.9), t.z-z) > R + t.rad) continue;
    dealDamage(e,t,mul,o);
  }
}
function rayHit(e, len, wid, mul, o){
  const f = fwd(e);
  for(const t of G.ents){
    if(!canHit(e,t)) continue;
    const dx=t.x-e.x, dz=t.z-e.z;
    const along = dx*f.x + dz*f.z;
    if(along < 0 || along > len) continue;
    const perp = Math.abs(dx*f.z - dz*f.x);
    if(perp > wid/2 + t.rad) continue;
    if(Math.abs(t.y - e.y) > 2.6) continue;
    dealDamage(e,t,mul,o);
  }
}
function nearestFoe(e, maxd){
  let best=null, bd=maxd||1e9;
  for(const t of G.ents){
    if(!canHit(e,t)) continue;
    const d = distXZ(t,e);
    if(d<bd){ bd=d; best=t; }
  }
  return best;
}

/* ------------------------------------------------------------ game state */
const G = {
  world:null, sector:"hk", ents:[], projs:[], parts:[], pops:[], beams:[], rings:[], arcs:[],
  orbits:[], drops:[], player:null, mission:null, cars:[], rain:[], weather:"clear", timeOfDay:0.28,
  camYaw:0, camPitch:0.26, camDist:6.4, shake:0,
  t:0, last:0, surge:0, combo:0, comboT:0, spawnT:0, bossEnt:null, lastCombat:-1e9,
  freeze:0, lockTarget:null,
  paused:true, ended:false
};
const GRAV = 26, JUMP = 10.2;

/* --------------------------------------------------------------- spawning */
function pickSpawn(from, minD, maxD){
  const sp = G.world.spawns;
  let fb = sp[0] || {x:0,z:0};
  for(let i=0;i<80;i++){
    const p = sp[(Math.random()*sp.length)|0];
    if(!from) return p;
    const d = Math.hypot(p.x-from.x, p.z-from.z);
    if(d > (minD||14) && d < (maxD||60)) return p;
    if(d > (minD||14)) fb = p;
  }
  return fb;
}
function spawnWanderer(){
  const boss = sectorBoss(G.sector);
  const pool = sectorBeings(G.sector).filter(b=>b.id!==boss.id).sort((a,b)=>a.tier-b.tier);
  if(!pool.length) return;
  const roll = Math.random();
  const i = roll<.6 ? (Math.random()*pool.length*.5)|0
          : roll<.9 ? (pool.length*.5 + Math.random()*pool.length*.35)|0
                    : (pool.length*.85 + Math.random()*pool.length*.15)|0;
  const b = pool[Math.min(pool.length-1, i)];
  const p = pickSpawn(G.player, 16, 62);
  G.ents.push(makeEnt(b.id, p.x, p.z, "foe", {scale: 1 + sectorIndex(G.sector)*0.010}));
}
function spawnBoss(){
  const b = sectorBoss(G.sector);
  const p = pickSpawn(G.player, 18, 34);
  const e = makeEnt(b.id, p.x, p.z, "foe", {scale:1.16 + sectorIndex(G.sector)*0.012, boss:true});
  e.maxHp = Math.round(e.maxHp*2.2); e.hp = e.maxHp;
  e.phase = 0; e.enrage = 1;
  G.ents.push(e); G.bossEnt = e;
  feed(b.name.toUpperCase()+" HAS COME OUT TO MEET YOU","big");
  G.shake += 1;
}

/* ------------------------------------------------------------ progression */
function onFoeDown(e){
  const b = e.b;
  if(!S.unlocked.includes(b.id)){ S.unlocked.push(b.id); feed("NEW HOST — "+b.name,"big"); }
  S.defeated[b.id] = true;
  const gained = Math.round((b.tier*9 + 12 + (e.boss?60:0)) * (1 + vesselLevel("essence")*0.14));
  S.essence += gained;
  if(G.player) noteKill(G.player.id);
  S.kills[G.sector] = killsIn(G.sector) + 1;
  (GEAR_BY_OWNER[b.id]||[]).forEach(g=>{
    if(!S.gearOwned.includes(g.id)) G.drops.push({x:e.x, y:e.y, z:e.z, gid:g.id, t:0});
  });
  const u = G.player;
  if(u && !u.dead){
    S.xp[u.id] = (S.xp[u.id]||0) + Math.round(gained*0.55);
    while(S.xp[u.id] >= xpNeeded(level(u.id))){
      S.xp[u.id] -= xpNeeded(level(u.id)); S.levels[u.id] = level(u.id)+1;
      feed(u.b.name+" reaches level "+S.levels[u.id],"good");
      u.maxHp = Math.round(u.maxHp*1.05); u.hp = Math.min(u.maxHp, u.hp+u.maxHp*.10);
    }
    if(u.gear && u.pot===1){
      S.gearKills[u.gear.id] = (S.gearKills[u.gear.id]||0)+1;
      if(S.gearKills[u.gear.id]>=attuneNeeded(u.gear.id) && !S.attuned.includes(u.gear.id)){
        S.attuned.push(u.gear.id); feed(u.gear.name+" is attuned — any host can echo it now","big");
      }
    }
  }
  if(e.boss){
    S.cleared[G.sector] = true; S.wins++;
    const ai = AI_LIST[sectorIndex(G.sector) % AI_LIST.length];
    if(ai && !S.aiOwned.includes(ai.id)){ S.aiOwned.push(ai.id); feed(ai.name+" is yours to install","big"); }
    G.bossEnt = null;
    if(STORY[G.sector]) S.story[G.sector] = true;
    setTimeout(()=>openScreen("cleared"), 1500);
  }
  save();
}
/* No reserves. If the body falls, the spark is driven out of the fight. */
function onHostDown(){
  G.ended = true;
  setTimeout(()=>openScreen("down"), 800);
}

/* You are in combat if you have traded damage recently, or something living
   is bearing down on you. While that holds you cannot let go of the body. */
const COMBAT_HOLD = 6000;
function inCombat(){ return (G.t - G.lastCombat) < COMBAT_HOLD; }
function combatLeft(){ return Math.max(0, Math.ceil((COMBAT_HOLD - (G.t - G.lastCombat))/1000)); }

/* ------------------------------------------------------------------ enemy */
/* A boss does not just have more health — it gets worse twice on the way
   down, and both times it clears the floor first. */
const BOSS_PHASES = [0.62, 0.30];
const BOSS_LINES = [
  n => n + " stops holding back.",
  n => n + " has decided this ends now."
];
function bossPhaseCheck(e){
  if(!e.boss || e.dead) return;
  const frac = e.hp / e.maxHp;
  const want = BOSS_PHASES.filter(t => frac <= t).length;
  if(want <= (e.phase||0)) return;
  e.phase = want;
  e.enrage = 1 + want*0.24;
  e.fx = {};
  setFx(e, "iframe", 1100);
  /* the room gets cleared */
  const R = 9 + want*3;
  for(const t of G.ents){
    if(t.dead || t.team === "foe" || distXZ(t,e) > R) continue;
    const a = Math.atan2(t.x-e.x, t.z-e.z);
    t.vx += Math.sin(a)*16; t.vz += Math.cos(a)*16; t.vy += 5;
    if(t.team === "you") dealDamage(e, t, 0.55, {unblockable:false});
  }
  shock(e.x, e.y+0.4, e.z, R, e.pal.c3, 900);
  burst(e.x, e.y+1, e.z, 40, e.pal.c3);
  G.shake += 1.2; G.freeze = Math.max(G.freeze, 130);
  SFX.slam(e.x, e.z, R); SFX.tell(e.x, e.z);
  feed(BOSS_LINES[want-1](e.b.name.toUpperCase()), "big");
  /* and it does not come alone */
  const pool = sectorBeings(G.sector).filter(b=>b.id!==e.b.id).sort((a,b)=>a.tier-b.tier);
  for(let i=0;i<2 && pool.length;i++){
    const b = pool[Math.min(pool.length-1, Math.floor(pool.length*0.55))];
    const s = pickSpawn(e, 6, 16);
    const add = makeEnt(b.id, s.x, s.z, "foe", {scale:1.05});
    add.missionTag = "add";
    G.ents.push(add);
  }
}

const MAX_ATTACKERS = 3;
function attackerCount(){ let n=0; for(const e of G.ents) if(!e.dead && e.team==="foe" && e.engaged) n++; return n; }
function enemyThink(e, dt){
  const p = G.player;
  if(!p || p.dead){ e.mx=e.mz=0; e.engaged=false; return; }
  const dx = p.x-e.x, dz = p.z-e.z, d = Math.hypot(dx,dz);
  e.yaw = Math.atan2(dx, dz);
  const aggro = e.boss ? 80 : 38;
  if(d > aggro){
    e.aiT -= dt;
    if(e.aiT<=0){ e.aiT = 1400+Math.random()*2400; e.wander = Math.random()*6.283; }
    e.mx = Math.sin(e.wander||0)*.4; e.mz = Math.cos(e.wander||0)*.4;
    e.engaged = false; return;
  }
  const want = e.act.ranged ? 11 : reachOf(e.act.light)*0.82 + e.rad + p.rad;
  const band = e.act.ranged ? 3.2 : 0.7;
  if(d > want+band){ e.mx = dx/d; e.mz = dz/d; }
  else if(d < want-band){ e.mx = -dx/d; e.mz = -dz/d; }
  else { const s = Math.sin(now()/900 + e.size*7); e.mx = -dz/d*s*.7; e.mz = dx/d*s*.7; }
  if(p.y > e.y + 3 && e.canFly) e.fly = true;
  else if(e.fly && Math.abs(p.y-e.y) < 1.4) e.fly = false;
  if(hasFx(e,"stun")){ e.mx=e.mz=0; return; }
  if(!e.engaged){
    if(e.boss || attackerCount() < MAX_ATTACKERS){ e.engaged = true; e.engagedT = now()+2600+Math.random()*1800; }
    else { const s = Math.sin(now()/700 + e.size*5); e.mx = -dz/d*s; e.mz = dx/d*s; return; }
  } else if(now() > e.engagedT && !e.boss){ e.engaged = false; e.atkT = now()+900; return; }
  if(now() < e.atkT) return;
  const inRange = e.act.ranged ? d < 30 : d < reachOf(e.act.light) + e.rad + p.rad + 0.7;
  if(!inRange) return;
  const skill = e.boss ? .9 : .5;
  for(const slot of ["ult","power","light"]){
    if(!ready(e,slot)) continue;
    if(slot!=="light" && Math.random() > skill) continue;
    if(slot === "light"){ useAbility(e, slot); }
    else {
      /* wind up first, so it can be blocked, parried or rolled */
      e.tell = {slot, at: now() + (e.boss ? 520 : 440)};
      SFX.tell(e.x, e.z);
      e.mx = e.mz = 0;
    }
    e.atkT = now() + (e.boss?260:460) + Math.random()*320;
    return;
  }
  if(ready(e,"util") && e.hp < e.maxHp*.5 && Math.random()<.35){ useAbility(e,"util"); e.atkT = now()+700; }
}

/* ----------------------------------------------------------------- update */
function stepEnt(e, dts){
  let spd = e.act.spd*MPU * (1 + (e.st.s-30)/300);
  if(e.blocking){ spd *= 0.42; e.nrg = Math.max(0, e.nrg - BLOCK_DRAIN*dts); if(e.nrg<=0) e.blocking = false; }
  if(hasFx(e,"haste")) spd *= 1.35;
  if(hasFx(e,"stun")) spd = 0;
  if(e.fly) spd *= 1.7;
  if(e.enrage) spd *= e.enrage;

  if(e.tell){
    if(hasFx(e,"stun")) e.tell = null;                 /* interrupted */
    else if(now() >= e.tell.at){ const sl = e.tell.slot; e.tell = null; useAbility(e, sl); }
    else { e.mx = e.mz = 0; }
  }
  if(e.rollT && now() < e.rollT){
    e.vx = Math.sin(e.rollYaw)*e.rollSpeed;
    e.vz = Math.cos(e.rollYaw)*e.rollSpeed;
  } else if(e.rollT && now() >= e.rollT){ e.rollT = 0; e.vx *= .4; e.vz *= .4; }
  if(e.dashT && now() < e.dashT){
    e.vx = Math.sin(e.dashYaw)*e.dashSpeed;
    e.vz = Math.cos(e.dashYaw)*e.dashSpeed;
    for(const t of G.ents){
      if(t.dead||t.team===e.team||e.dashHit.has(t)) continue;
      if(distXZ(t,e) < e.rad+t.rad+0.7 && Math.abs(t.y-e.y)<2){ e.dashHit.add(t); dealDamage(e,t,e.dashMul,e.dashOpts); }
    }
  } else {
    if(e.dashT && now()>=e.dashT){ e.dashT = 0; e.vx*=.35; e.vz*=.35; }
    const mx = e.mx||0, mz = e.mz||0;
    const m = Math.hypot(mx,mz);
    const tx = m>0.001 ? (mx/Math.max(1,m))*spd : 0;
    const tz = m>0.001 ? (mz/Math.max(1,m))*spd : 0;
    const accel = e.grounded ? 14 : 6;
    e.vx += (tx-e.vx)*Math.min(1, dts*accel);
    e.vz += (tz-e.vz)*Math.min(1, dts*accel);
  }
  e.moving = Math.hypot(e.vx,e.vz) > 1.2;
  if(e === G.player){
    if(e.moving && e.grounded && !e.fly) SFX.step(e);
    if(e.grounded && e.wasAir) SFX.land(e);
    e.wasAir = !e.grounded;
  }

  /* vertical */
  if(e.fly){
    const want = (e.wantUp?1:0) - (e.wantDown?1:0);
    e.vy += ((want*8.5) - e.vy)*Math.min(1, dts*6);
    if(!e.wantUp && !e.wantDown) e.vy += (0 - e.vy)*Math.min(1, dts*3);
  } else {
    e.vy -= GRAV*dts;
  }
  e.x += e.vx*dts; e.y += e.vy*dts; e.z += e.vz*dts;
  resolveXZ(e);
  const gy = groundAt(e.x, e.z, e.rad);
  if(e.y <= gy){ e.y = gy; if(e.vy<0) e.vy = 0; e.grounded = true; }
  else e.grounded = false;
  if(e.y > 130) e.y = 130;

  /* status ticks */
  if(hasFx(e,"burn")  && G.t % 420 < dts*1000) e.hp -= e.maxHp*0.012;
  if(hasFx(e,"bleed") && G.t % 420 < dts*1000) e.hp -= e.maxHp*0.011;
  if(hasFx(e,"regen") && G.t % 420 < dts*1000) e.hp = Math.min(e.maxHp, e.hp+e.maxHp*0.014);
  if(e.ai && e.ai.fx==="repair" && G.t % 900 < dts*1000) e.hp = Math.min(e.maxHp, e.hp+e.maxHp*0.012);
  if(e.team==="you" && now()-(e.lastHurt||0) > 4200 && e.hp < e.maxHp) e.hp = Math.min(e.maxHp, e.hp + e.maxHp*0.05*dts*(1 + vesselLevel("regen")*0.45));
  if(e.boss) bossPhaseCheck(e);
  if(e.hp<=0 && !e.dead){ killEnt(e); return; }

  /* multi-hit specials */
  if(e.blitz && now() >= e.blitz.next){
    const t = nearestFoe(e, 26);
    if(t){
      const a = Math.atan2(t.x-e.x, t.z-e.z);
      e.x = t.x - Math.sin(a)*(e.rad+t.rad); e.z = t.z - Math.cos(a)*(e.rad+t.rad);
      e.y = t.y; e.yaw = a;
      dealDamage(e,t,e.blitz.mul,e.blitz.opts);
      G.arcs.push({e, r:e.rad+2.4, t:0, life:150, c:e.pal.c3, yaw:a});
    }
    if(--e.blitz.left <= 0) e.blitz = null; else e.blitz.next = now()+140;
  }
  if(e.frenzy && now() >= e.frenzy.next){
    sphereHit(e, e.x, e.y, e.z, e.frenzy.R, e.frenzy.mul, e.frenzy.opts);
    shock(e.x, e.y+0.4, e.z, e.frenzy.R, e.pal.c3, 240);
    if(--e.frenzy.left <= 0) e.frenzy = null; else e.frenzy.next = now()+190;
  }

  let regen = 15 + e.maxNrg*0.06;
  if(e.ai && e.ai.fx==="allocate") regen *= 1.3;
  if(e.ai && e.ai.fx==="encourage" && e.hp<e.maxHp*.5) regen += 12;
  e.nrg = Math.min(e.maxNrg, e.nrg + regen*dts);
}

function update(dt){
  const dts = dt/1000;
  G.t += dt;
  const p = G.player;

  if(p && !p.dead && !G.paused){
    const mv = readMove();
    /* movement is relative to where the camera is looking */
    const cy = Math.cos(G.camYaw), sy = Math.sin(G.camYaw);
    p.mx = mv.y*sy + mv.x*cy;
    p.mz = mv.y*cy - mv.x*sy;
    p.yaw += angDelta(p.yaw, G.camYaw) * Math.min(1, dts*14);
    p.wantUp = !!input.jump; p.wantDown = !!input.down2;
    if(p.canFly && input.fly && !p.fly){ p.fly = true; p.vy = 5; feed(p.b.name+" leaves the ground","good"); }
    else if(!input.fly && p.fly){ p.fly = false; }
    if(!p.fly && input.jump && p.grounded){ p.vy = JUMP; p.grounded = false; }
    p.blocking = !!input.block && !hasFx(p,"stun") && p.nrg > 0 && !p.rollT;
    if(p.blocking && !p.wasBlocking) p.blockStart = now();
    p.wasBlocking = p.blocking;
    if(input.dodge && !p.canFly) startRoll(p, mv);
    if(!p.blocking) for(const slot of ["light","power","util","ult"]) if(input[slot]) useAbility(p, slot);
    if(input.surgeGo && G.surge>=100){
      G.surge = 0; setFx(p,"surge", 5000 + vesselLevel("surge")*1000);
      ["burn","bleed","weaken","mark","stun"].forEach(k=>p.fx[k]=0);
      p.nrg = p.maxNrg; shock(p.x,p.y+0.4,p.z,4,GOLD3,700); G.shake += .7;
      SFX.surge();
      feed("BURN THROUGH — the vessel stops being careful","big");
    }
    input.surgeGo = false;
  }

  if(G.lockTarget && (G.lockTarget.dead || !p || distXZ(G.lockTarget,p) > 45)) G.lockTarget = null;
  if(G.lockTarget && p && !p.dead){
    const want = Math.atan2(G.lockTarget.x-p.x, G.lockTarget.z-p.z);
    G.camYaw += angDelta(G.camYaw, want) * Math.min(1, dts*7);
  }
  for(const e of G.ents){
    if(e.dead) continue;
    if(e.team==="foe"){
      enemyThink(e, dt);
      /* something is coming for you — that counts as being in a fight */
      if(p && !p.dead && e.engaged && distXZ(e,p) < 25) G.lastCombat = G.t;
    }
    else if(e.team==="civ"){ civThink(e, dt); }
    else if(G.paused){ e.mx = e.mz = 0; }
    stepEnt(e, dts);
  }
  /* keep bodies from standing inside each other */
  for(let i=0;i<G.ents.length;i++){
    const a = G.ents[i]; if(a.dead) continue;
    for(let j=i+1;j<G.ents.length;j++){
      const b = G.ents[j]; if(b.dead) continue;
      if(Math.abs(a.y-b.y) > (a.height+b.height)*.4) continue;
      const dx=b.x-a.x, dz=b.z-a.z, d=Math.hypot(dx,dz), min=a.rad+b.rad;
      if(d>0.0001 && d<min){ const k=(min-d)/d*.5; a.x-=dx*k; a.z-=dz*k; b.x+=dx*k; b.z+=dz*k; }
    }
  }

  /* projectiles */
  for(let i=G.projs.length-1;i>=0;i--){
    const pr = G.projs[i]; pr.t += dt;
    if(pr.home){
      const t = nearestFoe(pr.owner, 40);
      if(t){
        const a = Math.atan2(t.x-pr.x, t.z-pr.z);
        const sp = Math.hypot(pr.vx,pr.vz);
        pr.vx += (Math.sin(a)*sp - pr.vx)*Math.min(1, dts*pr.home*3);
        pr.vz += (Math.cos(a)*sp - pr.vz)*Math.min(1, dts*pr.home*3);
        pr.vy += (((t.y+t.height*.6) - pr.y)*2 - pr.vy)*Math.min(1, dts*pr.home*2);
      }
    }
    pr.x += pr.vx*dts; pr.y += pr.vy*dts; pr.z += pr.vz*dts;
    let gone = pr.t > pr.life || Math.abs(pr.x)>WORLD/2 || Math.abs(pr.z)>WORLD/2 || pr.y < 0;
    if(!gone) for(const b of G.world.boxes){
      if(pr.y < b.h && Math.abs(pr.x-b.x)<b.w/2 && Math.abs(pr.z-b.z)<b.d/2){
        gone = true; spark(pr.x,pr.y,pr.z,6,pr.c); break; }
    }
    if(!gone) for(const t of G.ents){
      if(t.dead||t.team===pr.team||pr.hit.has(t)) continue;
      if(Math.hypot(t.x-pr.x, (t.y+t.height*.55)-pr.y, t.z-pr.z) < t.rad+pr.r+0.4){
        pr.hit.add(t); dealDamage(pr.owner,t,pr.mul,pr.opts);
        if(!pr.pierce) gone = true;
        break;
      }
    }
    if(gone) G.projs.splice(i,1);
  }
  /* orbiting blades */
  for(let i=G.orbits.length-1;i>=0;i--){
    const ob = G.orbits[i]; ob.t += dt; ob.ang += dts*4.2;
    if(ob.t>ob.life || ob.owner.dead){ G.orbits.splice(i,1); continue; }
    ob.px = ob.owner.x + Math.sin(ob.ang)*ob.rad;
    ob.py = ob.owner.y + ob.owner.height*0.6;
    ob.pz = ob.owner.z + Math.cos(ob.ang)*ob.rad;
    for(const t of G.ents){
      if(t.dead||t.team===ob.owner.team) continue;
      if((ob.cool[t.b.id]||0) > now()) continue;
      if(Math.hypot(t.x-ob.px, (t.y+t.height*.5)-ob.py, t.z-ob.pz) < t.rad+0.8){
        ob.cool[t.b.id] = now()+420; dealDamage(ob.owner,t,ob.mul,{});
      }
    }
  }
  /* particles and short-lived things */
  for(let i=G.parts.length-1;i>=0;i--){
    const q=G.parts[i]; q.t+=dt;
    q.x+=q.vx*dts; q.y+=q.vy*dts; q.z+=q.vz*dts; q.vy-=22*dts;
    if(q.t>q.life) G.parts.splice(i,1);
  }
  for(let i=G.pops.length-1;i>=0;i--){ const q=G.pops[i]; q.t+=dt; q.y+=1.6*dts; if(q.t>q.life) G.pops.splice(i,1); }
  const age = arr => { for(let i=arr.length-1;i>=0;i--){ arr[i].t+=dt; if(arr[i].t>arr[i].life) arr.splice(i,1); } };
  age(G.beams); age(G.rings); age(G.arcs);

  /* gear lying in the street */
  for(let i=G.drops.length-1;i>=0;i--){
    const d = G.drops[i]; d.t += dt;
    if(p && Math.hypot(p.x-d.x, p.z-d.z) < 1.8 && Math.abs(p.y-d.y) < 3){
      const g = GEAR_BY_ID[d.gid];
      if(!S.gearOwned.includes(g.id)) S.gearOwned.push(g.id);
      feed("PICKED UP "+g.name.toUpperCase()+" — only works for "+g.owner,"big");
      shock(d.x,d.y+0.4,d.z,2,GOLD3,500);
      G.drops.splice(i,1); save();
    }
  }

  /* keep the streets busy */
  const foes = G.ents.filter(e=>!e.dead && e.team==="foe" && !e.missionTag).length;
  G.spawnT -= dt;
  const cap = 5 + Math.min(3, (sectorIndex(G.sector)/8)|0);
  if(foes < cap && G.spawnT<=0 && !G.paused){ spawnWanderer(); G.spawnT = 2400; }
  if(!G.bossEnt && !sectorCleared(G.sector) && bossReady(G.sector) && !G.paused
     && !G.ents.some(e=>e.boss && !e.dead)) spawnBoss();

  for(let i=G.ents.length-1;i>=0;i--){
    const e = G.ents[i];
    if(e.dead && now()-e.deadT > 1000 && e!==G.player) G.ents.splice(i,1);
  }
  updateCars(dt); updateRain(dt); stepSky(dt); hintTick();
  updateMission(dt);
  if(G.combo && now()>G.comboT) G.combo = 0;
  G.shake *= Math.pow(0.0018, dts);
}
/* a roll: 340 ms of committed movement with a window you cannot be hit in */
const ROLL_CD = 720;
function startRoll(e, mv){
  if(e.rollT || (e.rollCd||0) > now() || hasFx(e,"stun") || !e.grounded) return;
  const cy = Math.cos(G.camYaw), sy = Math.sin(G.camYaw);
  let dx, dz;
  if(mv && (mv.x || mv.y)){ dx = mv.y*sy + mv.x*cy; dz = mv.y*cy - mv.x*sy; }
  else { dx = -Math.sin(e.yaw); dz = -Math.cos(e.yaw); }
  e.rollYaw = Math.atan2(dx, dz);
  e.rollT = now() + 340; e.rollCd = now() + ROLL_CD;
  e.rollSpeed = 12.5;
  e.blocking = false;
  setFx(e, "iframe", 300 + (e.team==="you" ? vesselLevel("iframe")*70 : 0));
  spark(e.x, e.y+0.4, e.z, 6, GUARD3);
}
function toggleLock(){
  if(G.lockTarget){ G.lockTarget = null; feed("Lock released",""); return; }
  const t = G.player ? nearestFoe(G.player, 45) : null;
  if(t){ G.lockTarget = t; feed("Locked on "+t.b.name, "good"); }
}
function angDelta(a,b){ let d=(b-a)%6.283; if(d>3.1416) d-=6.283; if(d<-3.1416) d+=6.283; return d; }

/* ==========================================================================
   MISSIONS
   Free roam needs a reason to walk somewhere. Every sector generates work
   out of its own roster, so a mission in Hell's Kitchen reads like Hell's
   Kitchen and a mission on Titan reads like Titan.
   ========================================================================== */
const MISSION_DEFS = {
  hunt: {
    name: "Bring down",
    line: t => `${t} is somewhere in this sector. Find them and put them down.`,
    reward: 1.6
  },
  hold: {
    name: "Hold the line",
    line: () => `Stand your ground inside the marker for thirty seconds. They will keep coming.`,
    reward: 1.4
  },
  rescue: {
    name: "Get them clear",
    line: n => `${n} people are pinned down out there. Reach each of them and they will run.`,
    reward: 1.3
  },
  recover: {
    name: "Recover",
    line: t => `${t} is lying in the open with something standing over it. Take it back.`,
    reward: 1.5
  },
  chase: {
    name: "Run them down",
    line: t => `${t} is running. Catch them before they are gone.`,
    reward: 1.4
  }
};

const CIVILIAN_NAMES = ["Bystander","Paramedic","Night Nurse","Beat Cop","Shop Owner",
  "Kid on a Bike","Cab Driver","Reporter","Fire Marshal","Dock Worker"];

/* three offers per sector, stable until you clear them */
function missionOffers(sectorId){
  const rng = mulberry(hash(sectorId + "/m" + (S.missionRound||0)));
  const pool = sectorBeings(sectorId).slice().sort((a,b)=>a.tier-b.tier);
  const boss = sectorBoss(sectorId);
  const cands = pool.filter(b=>b.id!==boss.id);
  const gearHere = cands.flatMap(b=>(GEAR_BY_OWNER[b.id]||[]).map(g=>({g, b})));
  const kinds = ["hunt","hold","rescue","chase"];
  if(gearHere.length) kinds.push("recover");
  const out = [];
  for(let i=0;i<3;i++){
    const kind = kinds[Math.floor(rng()*kinds.length)];
    const target = cands[Math.floor(rng()*cands.length)] || boss;
    const pick = gearHere.length ? gearHere[Math.floor(rng()*gearHere.length)] : null;
    out.push({
      id: sectorId+"/"+(S.missionRound||0)+"/"+i,
      kind, sector: sectorId,
      targetId: target.id,
      gearId: kind==="recover" && pick ? pick.g.id : null,
      gearOwner: kind==="recover" && pick ? pick.b.id : null,
      count: 3,
      tier: target.tier
    });
  }
  return out;
}
function missionTitle(m){
  const d = MISSION_DEFS[m.kind];
  if(m.kind==="hunt")    return d.name+" "+BY_ID[m.targetId].name;
  if(m.kind==="recover") return d.name+" the "+GEAR_BY_ID[m.gearId].name;
  if(m.kind==="chase")   return d.name+" "+BY_ID[m.targetId].name;
  return d.name;
}
function missionLine(m){
  const d = MISSION_DEFS[m.kind];
  if(m.kind==="hunt")    return d.line(BY_ID[m.targetId].name);
  if(m.kind==="recover") return d.line(GEAR_BY_ID[m.gearId].name);
  if(m.kind==="chase")   return d.line(BY_ID[m.targetId].name);
  if(m.kind==="rescue")  return d.line(m.count);
  return d.line();
}

function startMission(m){
  if(!G.world || G.mission) return;
  const p = G.player;
  const spot = pickSpawn(p, 34, 90);
  G.mission = {def:m, t:0, done:false, failed:false, marker:{x:spot.x, z:spot.z},
               held:0, freed:0, ents:[]};
  const M = G.mission;

  if(m.kind === "hunt"){
    const e = makeEnt(m.targetId, spot.x, spot.z, "foe", {scale:1.12, mission:true});
    e.missionTag = "hunt"; e.maxHp = Math.round(e.maxHp*1.35); e.hp = e.maxHp;
    G.ents.push(e); M.ents.push(e); M.marker = e;
  }
  else if(m.kind === "chase"){
    const e = makeEnt(m.targetId, spot.x, spot.z, "foe", {scale:0.95});
    e.missionTag = "runner"; e.runner = true;
    e.act = Object.assign({}, e.act, {spd: e.act.spd*1.35});
    G.ents.push(e); M.ents.push(e); M.marker = e;
    M.limit = 45000;
  }
  else if(m.kind === "recover"){
    G.drops.push({x:spot.x, y:0, z:spot.z, gid:m.gearId, t:0});
    for(let i=0;i<2;i++){
      const g = makeEnt(m.gearOwner, spot.x + (i?4:-4), spot.z + 3, "foe", {scale:1.05});
      G.ents.push(g); M.ents.push(g);
    }
  }
  else if(m.kind === "hold"){
    M.limit = null; M.need = 30000;
  }
  else if(m.kind === "rescue"){
    const civPool = BEINGS.filter(b=>b.tags.includes("civilian"));
    for(let i=0;i<m.count;i++){
      const s2 = pickSpawn(p, 26, 100);
      const cb = civPool[(hash(m.id+"c"+i)>>>5) % civPool.length] || BY_ID["turk-barrett"];
      const c = makeEnt(cb.id, s2.x, s2.z, "civ", {scale:0.7});
      c.civ = true; c.civName = CIVILIAN_NAMES[(hash(m.id+i)>>>3) % CIVILIAN_NAMES.length];
      c.maxHp = 120; c.hp = 120; c.size = 0.92; c.height = 1.8*0.92; c.rad = 0.34;
      G.ents.push(c); M.ents.push(c);
    }
    M.limit = 90000;
  }
  feed(missionTitle(m).toUpperCase(), "big");
  feed(missionLine(m), "");
  save();
}

function abandonMission(){
  if(!G.mission) return;
  G.mission.ents.forEach(e=>{ if(!e.dead && e.team!=="you") e.dead = true, e.deadT = now(); });
  G.mission = null;
  feed("Mission abandoned", "");
}

function updateMission(dt){
  const M = G.mission;
  if(!M || M.done) return;
  const p = G.player;
  M.t += dt;
  const m = M.def;

  if(M.limit && M.t > M.limit){ failMission("Out of time"); return; }

  if(m.kind === "hunt"){
    const e = M.ents[0];
    if(e && e.dead) return completeMission();
  }
  else if(m.kind === "chase"){
    const e = M.ents[0];
    if(!e || e.dead) return completeMission();
    if(p && distXZ(e,p) < 3.2) return completeMission();
    /* it runs from you, and it is quick */
    if(p){
      const a = Math.atan2(e.x-p.x, e.z-p.z);
      e.mx = Math.sin(a); e.mz = Math.cos(a);
      e.yaw = a; e.engaged = false; e.atkT = now()+9999; e.tell = null;
    }
  }
  else if(m.kind === "recover"){
    if(!G.drops.some(d=>d.gid === m.gearId)) return completeMission();
  }
  else if(m.kind === "hold"){
    if(p && Math.hypot(p.x-M.marker.x, p.z-M.marker.z) < 9){
      M.held += dt;
      if(M.spawnT === undefined) M.spawnT = 0;
      M.spawnT -= dt;
      if(M.spawnT <= 0){ spawnWanderer(); M.spawnT = 3200; }
      if(M.held >= M.need) return completeMission();
    }
  }
  else if(m.kind === "rescue"){
    for(const c of M.ents){
      if(c.freed || c.dead) continue;
      if(p && distXZ(c,p) < 2.6){
        c.freed = true; M.freed++;
        G.pops.push({x:c.x, y:c.y+2, z:c.z, txt:"CLEAR", t:0, life:900, col:"#5FE39A", size:16});
        feed((c.civName||"They")+" runs for it — "+M.freed+" of "+m.count, "good");
      }
    }
    if(M.freed >= m.count) return completeMission();
    if(M.ents.every(c=>c.dead && !c.freed)) return failMission("They did not make it");
  }
}

function completeMission(){
  const M = G.mission; if(!M || M.done) return;
  M.done = true;
  const m = M.def;
  const gain = Math.round((60 + m.tier*22) * MISSION_DEFS[m.kind].reward);
  S.essence += gain;
  S.missionsDone = (S.missionsDone||0) + 1;
  S.missionSeen = (S.missionSeen||{}); S.missionSeen[m.id] = true;
  const p = G.player;
  if(p){
    S.xp[p.id] = (S.xp[p.id]||0) + Math.round(gain*0.6);
    while(S.xp[p.id] >= xpNeeded(level(p.id))){
      S.xp[p.id] -= xpNeeded(level(p.id)); S.levels[p.id] = level(p.id)+1;
      feed(p.b.name+" reaches level "+S.levels[p.id],"good");
    }
    shock(p.x, p.y+0.4, p.z, 4, GOLD3, 700);
  }
  SFX.reward();
  feed("MISSION COMPLETE — +"+gain+" essence", "big");
  if(S.missionsDone % 3 === 0){ S.missionRound = (S.missionRound||0)+1; feed("New work has come up", ""); }
  G.mission = null;
  save();
}
function failMission(why){
  const M = G.mission; if(!M) return;
  M.ents.forEach(e=>{ if(!e.dead && e.team!=="you"){ e.dead = true; e.deadT = now(); } });
  G.mission = null;
  feed("MISSION FAILED — "+why, "");
}

/* civilians: they do not fight, they get away from whatever is loudest */
function civThink(e, dt){
  const threat = nearestThreat(e, 40);
  if(e.freed || threat){
    const from = threat || G.player;
    if(from){
      const a = Math.atan2(e.x-from.x, e.z-from.z);
      e.mx = Math.sin(a); e.mz = Math.cos(a);
      e.yaw = a;
    }
  } else {
    e.aiT -= dt;
    if(e.aiT<=0){ e.aiT = 1800+Math.random()*2600; e.wander = Math.random()*6.283; }
    e.mx = Math.sin(e.wander||0)*.3; e.mz = Math.cos(e.wander||0)*.3;
    e.yaw = e.wander||0;
  }
}
function nearestThreat(e, maxd){
  let best=null, bd=maxd||1e9;
  for(const o of G.ents){
    if(o.dead || o.team!=="foe") continue;
    const d = distXZ(o,e);
    if(d<bd){ bd=d; best=o; }
  }
  return best;
}

function hintTick(){

  if(G.hintHold && G.t < G.hintHold) return;
  for(const h of HINTS){

    if(!h.when()) continue;
    S.hints[h.id] = true;
    G.hintHold = G.t + 7000;

/* ==========================================================================
   A CITY THAT IS DOING SOMETHING WHEN YOU ARE NOT
   Traffic on the roads, people on the pavement, weather overhead, and a sun
   that actually goes round.

/* ------------------------------------------------------------------ cars */
const CAR_COLS = ["#B4342C","#2C4C8A","#D8D2C4","#2A2A32","#6E7480","#1F6B4C","#C08A2A"];
function laneLines(){                     /* world coords of every street centre-line */
  const out = [];
  for(let k = -Math.floor(WORLD/2/BLOCK); k <= Math.floor(WORLD/2/BLOCK); k++) out.push(k*BLOCK - WORLD/2 + BLOCK/2*0);
  return out;
}
function spawnTraffic(n){
  G.cars = [];
  const lines = [];
  for(let v = -WORLD/2; v <= WORLD/2 + 1; v += BLOCK) lines.push(v);
  for(let i=0;i<n;i++){
    const axis = Math.random() < 0.5 ? 0 : 1;          /* 0 drives along x, 1 along z */
    const line = lines[(Math.random()*lines.length)|0];
    const back = Math.random() < 0.5;
    const lane = (back ? 3.2 : -3.2);
    const along = -WORLD/2 + Math.random()*WORLD;
    G.cars.push({
      axis, back, hp: 120, dead:false, t:0,
      x: axis ? line + lane : along,
      z: axis ? along : line + lane,
      spd: (7 + Math.random()*7) * (back ? -1 : 1),
      col: srgb(CAR_COLS[(Math.random()*CAR_COLS.length)|0]),
      len: 4.1 + Math.random()*1.2
    });
  }
}
function updateCars(dt){
  const dts = dt/1000, p = G.player;
  for(let i=G.cars.length-1;i>=0;i--){
    const c = G.cars[i];
    if(c.dead){ c.t += dt; if(c.t > 6000) G.cars.splice(i,1); continue; }
    let v = c.spd;
    /* they will not run you over — they stop, and then they lean on the horn */
    if(p && !p.fly && Math.abs(p.y) < 2){
      const dx = p.x - c.x, dz = p.z - c.z;
      const ahead = c.axis ? dz*Math.sign(c.spd) : dx*Math.sign(c.spd);
      const side  = c.axis ? Math.abs(dx - 0) : Math.abs(dz - 0);
      if(ahead > 0 && ahead < 9 && Math.hypot(dx,dz) < 10) v = 0;
    }
    if(c.axis) c.z += v*dts; else c.x += v*dts;
    const lim = WORLD/2 + 8;
    if(c.x > lim) c.x = -lim; if(c.x < -lim) c.x = lim;
    if(c.z > lim) c.z = -lim; if(c.z < -lim) c.z = lim;
  }
}
/* anything that lands near a car wrecks it */
function splashCars(att, x, z, r){
  if(att.team !== "you") return;
  for(const c of G.cars){
    if(c.dead) continue;
    if(Math.hypot(c.x-x, c.z-z) > r + 2.4) continue;
    c.hp -= 60;
    spark(c.x, 1.2, c.z, 8, SPARK_A);
    if(c.hp <= 0){
      c.dead = true; c.t = 0;
      burst(c.x, 1.4, c.z, 34, srgb("#FF8A3D"));
      shock(c.x, 0.4, c.z, 4.5, srgb("#FF8A3D"), 620);
      G.shake += 0.55; G.freeze = Math.max(G.freeze, 55);
      SFX.boom(c.x, c.z);
      G.pops.push({x:c.x, y:2.6, z:c.z, txt:"WRECKED", t:0, life:900, col:"#FF8A3D", size:15});
    }
  }
  for(const pr of G.world.props){
    if(pr.fallen) continue;
    if(Math.hypot(pr.x-x, pr.z-z) > r + 2) continue;
    pr.fallen = true; pr.fallDir = Math.random()*6.283;
    spark(pr.x, 2, pr.z, 6, SPARK_B);
  }
}

/* ------------------------------------------------------- people, wandering */
function spawnAmbientCivs(n){
  const pool = BEINGS.filter(b=>b.tags.includes("civilian"));
  for(let i=0;i<n;i++){
    const s = pickSpawn(G.player, 20, 140);
    const cb = pool[(Math.random()*pool.length)|0];
    if(!cb) return;
    const c = makeEnt(cb.id, s.x, s.z, "civ", {});
    c.civ = true; c.ambient = true;
    c.civName = CIVILIAN_NAMES[(Math.random()*CIVILIAN_NAMES.length)|0];
    c.maxHp = 100; c.hp = 100;
    G.ents.push(c);
  }
}

/* ------------------------------------------------------------- sky and rain */
const DAY_LEN = 480000;                    /* eight minutes for a full turn */
function applyDayNight(){
  const w = G.world; if(!w || !w.base) return;
  const t = (G.timeOfDay = ((G.timeOfDay||0.28) + (G.paused?0:0)) );
  const ang = t * 6.28318;
  SUN[0] = Math.cos(ang)*0.55; SUN[1] = Math.sin(ang); SUN[2] = 0.34;
  const l = Math.hypot(SUN[0],SUN[1],SUN[2]) || 1;
  SUN[0]/=l; SUN[1]/=l; SUN[2]/=l;
  const up = Math.max(0, SUN[1]);                       /* how high the sun is */
  const night = 1 - Math.min(1, up*3.2);
  const warm = Math.max(0, 1 - Math.abs(up-0.13)*5);    /* low sun, warm light */
  const b = w.base;
  for(let i=0;i<3;i++){
    const dayC = b.sun[i] * (0.25 + up*0.95);
    const warmTint = [1.28, 0.86, 0.55][i];
    const nightC = [0.16, 0.20, 0.38][i];
    w.sunCol[i] = dayC*(1-warm) + b.sun[i]*warmTint*0.9*warm;
    w.sunCol[i] = w.sunCol[i]*(1-night) + nightC*night;
    w.skyAmb[i] = b.skyAmb[i]*(0.30 + up*0.85)*(1-night) + [0.06,0.08,0.16][i]*night;
    w.grdAmb[i] = b.grdAmb[i]*(0.35 + up*0.75)*(1-night) + [0.03,0.03,0.05][i]*night;
    w.sky[i]    = b.sky[i]*(0.22 + up*1.0)*(1-night)   + [0.02,0.03,0.08][i]*night;
    w.skyTop[i] = b.skyTop[i]*(0.22 + up*1.0)*(1-night)+ [0.01,0.01,0.04][i]*night;
    w.fog[i]    = b.fog[i]*(0.28 + up*0.9)*(1-night)   + [0.03,0.04,0.09][i]*night;
  }
  if(G.weather === "rain"){
    for(let i=0;i<3;i++){ w.sunCol[i] *= 0.55; w.skyAmb[i] *= 0.85; w.fog[i] *= 1.15; }
  }
}
function stepSky(dt){
  if(G.paused) return;
  G.timeOfDay = ((G.timeOfDay||0.28) + dt/DAY_LEN) % 1;
}
/* setting the weather always rebuilds what it needs, so it can be set from
   anywhere — a quality change, the menu, or the roll on entering a sector */
function setWeather(kind){
  G.weather = kind;
  G.rain = [];
  if(kind === "rain"){
    const n = quality === "low" ? 90 : quality === "medium" ? 180 : 300;
    const p = G.player || {x:0,y:0,z:0};
    for(let i=0;i<n;i++) G.rain.push({
      x: p.x + (Math.random()-0.5)*44,
      z: p.z + (Math.random()-0.5)*44,
      y: p.y + Math.random()*24,
      seed: Math.random()
    });
  }
}
function rollWeather(){ setWeather(Math.random() < 0.28 ? "rain" : "clear"); }
function updateRain(dt){
  if(G.weather !== "rain" || !G.rain.length) return;
  const p = G.player || {x:0,y:0,z:0};
  const dts = dt/1000;
  for(const d of G.rain){
    d.y -= 26*dts;
    if(d.y < p.y - 2 || Math.abs(d.x - p.x) > 26 || Math.abs(d.z - p.z) > 26){
      d.x = p.x + (Math.random()-0.5)*44;
      d.z = p.z + (Math.random()-0.5)*44;
      d.y = p.y + 14 + Math.random()*10;
    }
  }
}

/* ------------------------------------------------------------------- draw */
function buildCity(){
  for(const c of G.cars){
    const dx = c.x - EYE[0], dz = c.z - EYE[2];
    if(Math.hypot(dx,dz) > 130) continue;
    const yaw = c.axis ? (c.back ? Math.PI : 0) : (c.back ? -Math.PI/2 : Math.PI/2);
    if(c.dead){
      const k = Math.min(1, c.t/900);
      draw(MESH_BOX, c.x, 0.6, c.z, yaw + k*0.3, k*0.2, k*0.25, 2.0, 1.0, c.len,
           [0.10,0.09,0.09], {rough:0.95, metal:0.2});
      continue;
    }
    draw(MESH_BOX, c.x, 0.75, c.z, yaw,0,0, 2.0, 0.85, c.len, c.col, {rough:0.22, metal:0.75});
    draw(MESH_BOX, c.x, 1.42, c.z, yaw,0,0, 1.75, 0.62, c.len*0.52, [0.05,0.06,0.09],
         {rough:0.08, metal:0.4});
    const f = c.back ? -1 : 1;
    draw(MESH_BOX, c.x + (c.axis?0:f*c.len*0.48), 0.72, c.z + (c.axis?f*c.len*0.48:0), yaw,0,0,
         1.5, 0.26, 0.14, [1,0.92,0.7], {kind:3, emis:0.9, alpha:0.95});
    for(const side of [-1,1]){
      draw(MESH_TUBE, c.x + (c.axis? side*0.95 : 0), 0.34, c.z + (c.axis? 0 : side*0.95),
           c.axis?0:Math.PI/2, Math.PI/2, 0, 0.66,2.0,0.66, [0.05,0.05,0.06], {rough:0.9});
    }
  }
  if(G.weather === "rain") for(const d of G.rain)

         {kind:3, alpha:0.34, emis:0.1});
}

/* ------------------------------------------------------------------ scene */
const UI = document.getElementById("ui");
const UX = UI.getContext("2d");
let VW=0, VH=0, DPR=1;
const PROJ = new Float32Array(16), VIEW = new Float32Array(16), VP = new Float32Array(16);
const LVIEW = new Float32Array(16), LPROJ = new Float32Array(16), LVP = new Float32Array(16);
const EYE = [0,0,0];

function resize(){
  DPR = Math.min(quality==="low" ? 1.25 : 2, window.devicePixelRatio||1);
  VW = window.innerWidth; VH = window.innerHeight;
  CV.width = Math.floor(VW*DPR); CV.height = Math.floor(VH*DPR);
  CV.style.width = VW+"px"; CV.style.height = VH+"px";
  UI.width = CV.width; UI.height = CV.height;
  UI.style.width = VW+"px"; UI.style.height = VH+"px";
  buildTargets();
  G.camDist = VW < 760 ? 7.4 : 6.4;
}
addEventListener("resize", resize);
addEventListener("orientationchange", ()=>setTimeout(resize,150));

function project(x,y,z){
  const w = VP[3]*x + VP[7]*y + VP[11]*z + VP[15];
  if(w <= 0.02) return null;
  const cx = VP[0]*x + VP[4]*y + VP[8]*z + VP[12];
  const cy = VP[1]*x + VP[5]*y + VP[9]*z + VP[13];
  return {x:(cx/w*0.5+0.5)*VW, y:(1-(cy/w*0.5+0.5))*VH, w};
}

const SUN = [0.42, 0.80, 0.28];
(function(){ const l = Math.hypot(...SUN); SUN[0]/=l; SUN[1]/=l; SUN[2]/=l; })();

function buildFrame(){
  const w = G.world, th = w.th;
  /* ground */
  draw(MESH_BOX, 0, -0.5, 0, 0,0,0, WORLD, 1, WORLD, w.ground, {kind:1, rough:0.9, shadow:false});
  /* city */
  const cx = EYE[0], cz = EYE[2];
  for(const b of w.boxes){
    const d = Math.hypot(b.x-cx, b.z-cz);
    if(d > 260) continue;
    if(b.base){
      const h2 = b.h - b.base;
      draw(MESH_BOX, b.x, b.base + h2/2, b.z, 0,0,0, b.w, h2, b.d, b.col,
           {kind:2, rough:0.8, metal:0.05, accent:w.accent, shadow:d < 90});
      if(d < 120) for(let i=0;i<4;i++){          /* the pillars holding it up */
        const px = b.x + (i%2 ? 1 : -1)*(b.w/2 - 1.4);
        const pz = b.z + ((i>>1)%2 ? 1 : -1)*(b.d/2 - 1.4);
        draw(MESH_TUBE, px, b.base/2, pz, 0,0,0, 1.5, b.base, 1.5, b.col,
             {rough:0.75, metal:0.05, shadow:d < 90});
      }
    } else {
      draw(MESH_BOX, b.x, b.h/2, b.z, 0,0,0, b.w, b.h, b.d, b.col,
           {kind:2, rough:0.8, metal:0.05, accent:w.accent, shadow:d < 90});
    }
  }
  for(const p of w.props) drawProp(p, Math.hypot(p.x-cx, p.z-cz));

  /* people */
  for(const e of G.ents){
    if(e.dead && now()-e.deadT > 1100) continue;
    const d = Math.hypot(e.x-cx, e.z-cz);
    if(d > 110) continue;
    if(e.dead){
      const k = 1 - (now()-e.deadT)/1100;
      e.yaw += 0.0; drawChar(e, d + (1-k)*60);
    } else drawChar(e, d);
  }

  /* gear on the ground */
  for(const dp of G.drops){
    const bobY = 0.55 + Math.sin(G.t*0.003 + dp.x)*0.12;
    draw(MESH_BOX, dp.x, dp.y+bobY, dp.z, G.t*0.0016, 0.5, 0.3, 0.34,0.34,0.34,
         GOLD3, {rough:0.2, metal:0.9, emis:0.5});
    draw(MESH_TUBE, dp.x, dp.y+0.02, dp.z, 0,0,0, 1.6, 0.02, 1.6, GOLD3,
         {kind:3, alpha:0.30, emis:0.6});
  }

  buildMarker();
  buildCity();
  buildEffects();
}

/* a column of light over whatever the mission wants from you */
function buildMarker(){
  const M = G.mission;
  if(!M || M.done) return;
  const mk = M.marker;
  if(!mk) return;
  const x = mk.x, z = mk.z;
  const pulse = 0.6 + Math.sin(G.t*0.004)*0.2;
  draw(MESH_TUBE, x, 14, z, 0,0,0, 2.2, 28, 2.2, GOLD3, {kind:3, alpha:0.11*pulse, emis:0.5});
  const R = (M.def.kind === "hold") ? 9 : 1.9;
  for(let i=0;i<18;i++){
    const a = i/18*6.283 + G.t*0.0008;
    draw(MESH_BOX, x+Math.sin(a)*R, 0.25, z+Math.cos(a)*R, a,0,0,
         0.22, 0.5, 0.22, GOLD3, {kind:3, emis:0.9, alpha:0.55*pulse});
  }
}
const GOLD3 = srgb("#F7BC46");

function drawProp(p, d){
  if(d > 120) return;
  const s = p.s, c = p.col;
  if(p.fallen){
    draw(MESH_TUBE, p.x + Math.sin(p.fallDir)*2.2, 0.28, p.z + Math.cos(p.fallDir)*2.2,
         p.fallDir, Math.PI/2, 0, 0.30*s, 5.2*s, 0.30*s, METAL3, {rough:0.8, metal:0.5});
    return;
  }
  const MET = {rough:0.45, metal:0.6};
  if(p.k==="tree"){
    draw(MESH_TAPER, p.x, 1.6*s, p.z, 0,0,0, 0.32*s, 3.2*s, 0.32*s, BARK3, {rough:0.95});
    draw(MESH_SPH, p.x, 4.2*s, p.z, p.x, 0,0, 3.2*s, 2.8*s, 3.2*s, LEAF3, {rough:0.9});
  } else if(p.k==="rock"){
    draw(MESH_SPH, p.x, 0.9*s, p.z, p.x, 0.3, 0.2, 2.6*s, 1.8*s, 2.4*s, ROCK3, {rough:0.95});
  } else if(p.k==="spire"){
    draw(MESH_TAPER2, p.x, 3.0*s, p.z, p.z,0,0, 1.1*s, 6.0*s, 1.1*s, ROCK3, {rough:0.8});
    draw(MESH_SPH, p.x, 6.3*s, p.z, 0,0,0, 0.5*s,0.7*s,0.5*s, c, {kind:3, emis:0.9, alpha:0.9});
  } else if(p.k==="column"){
    draw(MESH_TUBE, p.x, 3.4*s, p.z, 0,0,0, 1.2*s, 6.8*s, 1.2*s, STONE3, {rough:0.75});
    draw(MESH_BOX, p.x, 7.0*s, p.z, 0,0,0, 1.8*s, 0.4*s, 1.8*s, STONE3, {rough:0.7});
  } else if(p.k==="shard"){
    draw(MESH_TAPER2, p.x, 2.4*s, p.z, p.x,0.1,0.1, 0.9*s, 5.0*s, 0.9*s, c, {rough:0.12, metal:0.3, emis:0.25, alpha:0.85});
  } else {                                            /* street light */
    draw(MESH_TUBE, p.x, 2.6*s, p.z, 0,0,0, 0.16*s, 5.2*s, 0.16*s, METAL3, MET);
    draw(MESH_BOX, p.x, 5.25*s, p.z, 0,0,0, 0.7*s, 0.16*s, 0.35*s, c, {kind:3, emis:1.1, alpha:0.95});
  }

const BARK3=srgb("#3A2A1A"), LEAF3=srgb("#2E4A1E"), ROCK3=srgb("#3A3648"),
      STONE3=srgb("#7A6A48"), METAL3=srgb("#4A4A52");

function buildEffects(){
  for(const pr of G.projs)

    draw(MESH_TUBE, mx, b.y, mz, b.yaw, Math.PI/2, 0, b.wid*k*0.35, b.len, b.wid*k*0.35, WHITE3,
         {kind:3, emis:1.4, alpha:k});
  }
  for(const rg of G.rings){

    }
  }
  for(const ar of G.arcs){
    const k = 1 - ar.t/ar.life;
    for(let i=0;i<6;i++){
      const a = ar.yaw + (i-2.5)*0.20;
      const rr = ar.r*(0.7+0.3*(1-k));

  for(const e of G.ents){

    if(e.blocking){

      draw(MESH_BOX, e.x+Math.sin(gy)*0.55, e.y+1.05*e.size, e.z+Math.cos(gy)*0.55,

    if(hasFx(e,"stun")){

      }

    if(!SHADOW){                       /* no shadow map — a blob keeps feet on the floor */
      const gy = groundAt(e.x, e.z, e.rad);
      draw(MESH_SPH_LO, e.x, gy+0.04, e.z, 0,0,0, 1.2*e.size, 0.02, 1.2*e.size, BLACK3,
           {kind:3, alpha:0.34*Math.max(0.15, 1-(e.y-gy)/14), emis:0});
    }
    const surge = hasFx(e,"surge");
    if(e.boss){
      const n2 = 6 + (e.phase||0)*4;
      const col = (e.phase||0) >= 2 ? TELL3 : (e.phase ? GOLD3 : e.pal.c3);
      for(let i=0;i<n2;i++){
        const a = G.t*(0.0018 + (e.phase||0)*0.0008) + i*(6.283/n2);
        const rr = (0.85 + Math.sin(G.t*0.003+i)*0.10)*e.size;
        draw(MESH_SPH_LO, e.x+Math.sin(a)*rr, e.y+(0.4+(i%4)*0.45)*e.size, e.z+Math.cos(a)*rr,
             0,0,0, 0.15,0.15,0.15, col, {kind:3, emis:1.1, alpha:0.85});
      }
    }
    if(!e.pal.glow && !surge) continue;
    const n = surge ? 7 : 4;
    for(let i=0;i<n;i++){
      const a = G.t*0.0022 + i*(6.283/n);
      const rr = (0.62 + Math.sin(G.t*0.003+i)*0.07)*e.size;
      draw(MESH_SPH_LO, e.x+Math.sin(a)*rr, e.y+(0.5+(i%3)*0.5)*e.size, e.z+Math.cos(a)*rr,
           0,0,0, 0.13,0.13,0.13, surge?GOLD3:e.pal.c3, {kind:3, emis:1.1, alpha:surge?0.95:0.7});
    }
    if(hasFx(e,"shield")||hasFx(e,"fortify"))
      draw(MESH_SPH, e.x, e.y+0.95*e.size, e.z, 0,0,0, 1.5*e.size, 2.0*e.size, 1.5*e.size,
           GREEN3, {kind:3, alpha:0.13, emis:0.4});
  }
}
const GREEN3 = srgb("#5FE39A"), TELL3 = srgb("#FF5340");

/* ------------------------------------------------------------------ passes */
function renderScene(){
  if(!G.world) return;
  drawCalls = 0;
  resetQueue();

  const p = G.player, q = QUALITY[quality];
  const tgt = p || {x:0,y:1,z:0,height:1.8};
  const sh = G.shake*0.16;
  const cp = Math.cos(G.camPitch), sp = Math.sin(G.camPitch);
  EYE[0] = tgt.x - Math.sin(G.camYaw)*cp*G.camDist + (Math.random()-.5)*sh;
  EYE[1] = tgt.y + tgt.height*0.72 + sp*G.camDist + (Math.random()-.5)*sh;
  EYE[2] = tgt.z - Math.cos(G.camYaw)*cp*G.camDist;
  const floor = groundAt(EYE[0], EYE[2], 0.6) + 0.9;
  if(EYE[1] < floor) EYE[1] = floor;
  pullCameraIn(tgt);
  const AT = [tgt.x, tgt.y + tgt.height*0.62, tgt.z];
  m4persp(VW<VH ? 1.16 : 0.98, VW/VH, 0.12, 600, PROJ);
  m4look(EYE, AT, UP3, VIEW);
  m4mul(PROJ, VIEW, VP);

  applyDayNight();
  buildFrame();

  /* ---- shadows ---- */
  let shadowOn = 0;
  if(SHADOW){
    const R = q.shadowRange;
    const c = [tgt.x, 0, tgt.z];
    m4ortho(-R, R, -R, R, 1, 320, LPROJ);
    m4look([c[0]+SUN[0]*150, c[1]+SUN[1]*150, c[2]+SUN[2]*150], c, UP3, LVIEW);
    m4mul(LPROJ, LVIEW, LVP);
    gl.bindFramebuffer(gl.FRAMEBUFFER, SHADOW.fb);
    gl.viewport(0,0,SHADOW.w,SHADOW.h);
    gl.clearColor(1,1,1,1);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    gl.enable(gl.DEPTH_TEST); gl.depthMask(true); gl.disable(gl.BLEND);
    gl.disable(gl.CULL_FACE);
    gl.useProgram(P_DEPTH); boundProg = null;
    gl.uniformMatrix4fv(P_DEPTH.u.uLightVP, false, LVP);
    const casters = Q_OPAQUE.filter(it=>it.shadow);
    replay(casters, P_DEPTH, false);
    gl.enable(gl.CULL_FACE);
    shadowOn = 1;
  }

  /* ---- main ---- */
  const toScreen = !SCENE;
  gl.bindFramebuffer(gl.FRAMEBUFFER, toScreen ? null : SCENE.fb);
  gl.viewport(0,0, toScreen?CV.width:SCENE.w, toScreen?CV.height:SCENE.h);
  const sky = G.world.sky;
  gl.clearColor(sky[0],sky[1],sky[2],1);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST); gl.depthMask(true);
  gl.enable(gl.CULL_FACE); gl.cullFace(gl.BACK);
  gl.disable(gl.BLEND);
  gl.useProgram(P_MAIN); boundProg = null;
  const U = P_MAIN.u;
  gl.uniformMatrix4fv(U.uProj, false, PROJ);
  gl.uniformMatrix4fv(U.uView, false, VIEW);
  gl.uniformMatrix4fv(U.uLightVP, false, LVP);
  gl.uniform3fv(U.uCam, EYE);
  gl.uniform3fv(U.uSunDir, SUN);
  gl.uniform3fv(U.uSunCol, G.world.sunCol);
  gl.uniform3fv(U.uSkyCol, G.world.skyAmb);
  gl.uniform3fv(U.uGrdCol, G.world.grdAmb);
  gl.uniform3fv(U.uFogCol, G.world.fog);
  gl.uniform1f(U.uFogD, G.world.fogD);
  gl.uniform1f(U.uTime, G.t*0.001);
  gl.uniform1f(U.uTonemap, toScreen ? 1 : 0);
  gl.uniform1f(U.uShadowOn, shadowOn);
  if(SHADOW){
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, SHADOW.tex);
    gl.uniform1i(U.uShadow, 0);
    gl.uniform1f(U.uTexel, 1/SHADOW.w);
  }
  /* sky dome first, from the inside */
  gl.cullFace(gl.FRONT); gl.depthMask(false);
  drawSky();
  gl.depthMask(true); gl.cullFace(gl.BACK);

  replay(Q_OPAQUE, P_MAIN, true);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  gl.depthMask(false);
  replay(Q_ALPHA, P_MAIN, true);
  gl.depthMask(true);
  gl.disable(gl.BLEND);

  /* ---- bloom + grade ---- */
  if(SCENE){
    gl.disable(gl.DEPTH_TEST);
    gl.bindFramebuffer(gl.FRAMEBUFFER, BLOOM_A.fb);
    gl.viewport(0,0,BLOOM_A.w,BLOOM_A.h);
    gl.useProgram(P_BRIGHT); boundProg = null;
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, SCENE.tex);
    gl.uniform1i(P_BRIGHT.u.uTex, 0); gl.uniform1f(P_BRIGHT.u.uThresh, 1.05);
    fullscreen(P_BRIGHT);

    gl.useProgram(P_BLUR); boundProg = null;
    gl.uniform1i(P_BLUR.u.uTex, 0);
    gl.bindFramebuffer(gl.FRAMEBUFFER, BLOOM_B.fb);
    gl.bindTexture(gl.TEXTURE_2D, BLOOM_A.tex);
    gl.uniform2f(P_BLUR.u.uDir, 1.4/BLOOM_A.w, 0);
    fullscreen(P_BLUR);
    gl.bindFramebuffer(gl.FRAMEBUFFER, BLOOM_A.fb);
    gl.bindTexture(gl.TEXTURE_2D, BLOOM_B.tex);
    gl.uniform2f(P_BLUR.u.uDir, 0, 1.4/BLOOM_A.h);
    fullscreen(P_BLUR);

    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0,0,CV.width,CV.height);
    gl.useProgram(P_POST); boundProg = null;
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, SCENE.tex);
    gl.uniform1i(P_POST.u.uTex, 0);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, BLOOM_A.tex);
    gl.uniform1i(P_POST.u.uBloom, 1);
    gl.uniform1f(P_POST.u.uBloomAmt, 0.34);
    gl.uniform1f(P_POST.u.uTime, G.t);
    gl.uniform1f(P_POST.u.uVig, 0.42);
    const hurt = p ? Math.max(0, 1 - (G.t - (p.lastHurt||-1e9))/650) * (1 - p.hp/p.maxHp) : 0;
    gl.uniform1f(P_POST.u.uHurt, Math.min(0.7, hurt));
    fullscreen(P_POST);
    gl.activeTexture(gl.TEXTURE0);
    gl.enable(gl.DEPTH_TEST);
  }
  drawOverlay();
}
const UP3 = [0,1,0];

/* Walk the line from the head out to where the camera wants to be, and stop
   at the first wall. Without this the view ends up inside a building every
   time you back into one. */
function pullCameraIn(tgt){
  const hx = tgt.x, hy = tgt.y + tgt.height*0.62, hz = tgt.z;
  let dx = EYE[0]-hx, dy = EYE[1]-hy, dz = EYE[2]-hz;
  const full = Math.hypot(dx,dy,dz);
  if(full < 0.05) return;
  const steps = 12, pad = 0.45;
  let best = 1;
  for(let i=1;i<=steps;i++){
    const t = i/steps;
    const px = hx+dx*t, py = hy+dy*t, pz = hz+dz*t;
    let blocked = false;
    for(const b of G.world.boxes){
      if(py > b.h + pad) continue;
      if(b.base && py < b.base - pad) continue;
      if(Math.abs(px-b.x) < b.w/2 + pad && Math.abs(pz-b.z) < b.d/2 + pad){ blocked = true; break; }
    }
    if(blocked){ best = Math.max(0.18, (i-1)/steps); break; }
  }
  if(best < 1){
    EYE[0] = hx + dx*best; EYE[1] = hy + dy*best; EYE[2] = hz + dz*best;
  }
}

/* ------------------------------------------------------------- 2D overlay */
function drawOverlay(){
  UX.setTransform(DPR,0,0,DPR,0,0);
  UX.clearRect(0,0,VW,VH);
  const p = G.player;

  for(const e of G.ents){
    if(e.dead || e===p) continue;
    const near = p ? distXZ(e,p) : 999;
    if(e.team === "civ"){
      if(near > 55) continue;
      const sc0 = project(e.x, e.y + e.height*1.16, e.z);
      if(!sc0) continue;
      UX.globalAlpha = Math.max(0.3, 1 - near/60);
      UX.font = '700 11px "Chivo Mono",ui-monospace,monospace'; UX.textAlign = "center";
      UX.lineWidth = 3; UX.strokeStyle = "rgba(0,0,0,.85)";
      const lbl = e.freed ? "SAFE" : (e.civName || "Civilian");
      UX.strokeText(lbl, sc0.x, sc0.y); UX.fillStyle = e.freed ? "#5FE39A" : "#8FE8FF";
      UX.fillText(lbl, sc0.x, sc0.y);
      UX.globalAlpha = 1;
      continue;
    }
    if(!e.boss && near > 40) continue;
    const sc = project(e.x, e.y + e.height*1.16, e.z);
    if(!sc || sc.x<-140 || sc.x>VW+140) continue;
    const w = e.boss ? 130 : 58;
    const a = Math.max(0.28, 1 - near/46);
    UX.globalAlpha = a;
    UX.fillStyle = "rgba(0,0,0,.6)"; UX.fillRect(sc.x-w/2-1, sc.y-1, w+2, 7);
    UX.fillStyle = e.boss ? "#F7BC46" : "#FF5340";
    UX.fillRect(sc.x-w/2, sc.y, w*Math.max(0,e.hp/e.maxHp), 5);
    if(e.boss && e.phase){
      UX.fillStyle = "#F7BC46";
      for(let i=0;i<e.phase;i++) UX.fillRect(sc.x + w/2 + 4 + i*7, sc.y, 5, 5);
    }
    if(e.boss || near < 22){
      UX.font = (e.boss?'700 15px':'700 11px')+' "Chivo Mono",ui-monospace,monospace';
      UX.textAlign="center"; UX.lineWidth=3.5; UX.strokeStyle="rgba(0,0,0,.9)";
      UX.strokeText(e.b.name, sc.x, sc.y-6);
      UX.fillStyle = e.boss ? "#F7BC46" : "#D6CEEA";
      UX.fillText(e.b.name, sc.x, sc.y-6);
    }
    UX.globalAlpha = 1;
  }
  for(const q of G.pops){
    const sc = project(q.x,q.y,q.z); if(!sc) continue;
    const k = 1-q.t/q.life;
    UX.globalAlpha = Math.min(1,k*1.7);
    UX.font = `700 ${q.size}px "Chivo Mono",ui-monospace,monospace`;
    UX.textAlign="center"; UX.lineWidth=4; UX.strokeStyle="rgba(0,0,0,.85)";
    UX.strokeText(q.txt, sc.x, sc.y); UX.fillStyle=q.col; UX.fillText(q.txt, sc.x, sc.y);
    UX.globalAlpha = 1;
  }
  for(const d of G.drops){
    const sc = project(d.x, d.y+1.6, d.z); if(!sc) continue;
    UX.font='700 10px "Chivo Mono",ui-monospace,monospace'; UX.textAlign="center";
    UX.lineWidth=3; UX.strokeStyle="rgba(0,0,0,.8)";
    const t = "◆ "+GEAR_BY_ID[d.gid].name.toUpperCase();
    UX.strokeText(t, sc.x, sc.y); UX.fillStyle="#F7BC46"; UX.fillText(t, sc.x, sc.y);
  }
  if(p){
    const m = 54;
    for(const e of G.ents){
      if(e.dead || e.team!=="foe") continue;
      const d = distXZ(e,p);
      if(d > 60 && !e.boss) continue;
      const sc = project(e.x, e.y+e.height*0.6, e.z);
      if(sc && sc.x>m && sc.x<VW-m && sc.y>m && sc.y<VH-m) continue;
      let ang;
      if(sc) ang = Math.atan2(sc.y-VH/2, sc.x-VW/2);
      else { const rel = Math.atan2(e.x-p.x, e.z-p.z) - G.camYaw;
             ang = Math.atan2(-Math.cos(rel), Math.sin(rel)); }
      const k = Math.min(Math.abs((VW/2-m)/(Math.cos(ang)||1e-6)), Math.abs((VH/2-m)/(Math.sin(ang)||1e-6)));
      const px = VW/2 + Math.cos(ang)*k, py = VH/2 + Math.sin(ang)*k;
      UX.save(); UX.translate(px,py); UX.rotate(ang);
      UX.globalAlpha = e.boss?1:.65;
      UX.fillStyle = e.boss?"#F7BC46":"#FF5340";
      UX.beginPath(); UX.moveTo(13,0); UX.lineTo(-9,-8); UX.lineTo(-9,8); UX.closePath(); UX.fill();
      UX.restore();
      if(e.boss){
        UX.globalAlpha=1; UX.font='700 11px "Chivo Mono",ui-monospace,monospace'; UX.textAlign="center";
        UX.fillStyle="#F7BC46"; UX.fillText(e.b.name.toUpperCase(), px, py + (py<VH/2?26:-18));
      }
      UX.globalAlpha = 1;
    }
    /* a small mark at the middle of the screen, so aiming reads */
    UX.globalAlpha = 0.45; UX.strokeStyle = "#EDE7DA"; UX.lineWidth = 1.5;
    UX.beginPath();
    UX.moveTo(VW/2-9, VH/2); UX.lineTo(VW/2-3, VH/2);
    UX.moveTo(VW/2+3, VH/2); UX.lineTo(VW/2+9, VH/2);
    UX.moveTo(VW/2, VH/2-9); UX.lineTo(VW/2, VH/2-3);
    UX.moveTo(VW/2, VH/2+3); UX.lineTo(VW/2, VH/2+9);
    UX.stroke(); UX.globalAlpha = 1;
  }
  const M = G.mission;
  if(M && !M.done && p){
    const mk = M.marker;
    const d = mk ? Math.round(Math.hypot(mk.x-p.x, mk.z-p.z)) : 0;
    let sub = "";
    if(M.def.kind==="hold")   sub = Math.max(0, Math.ceil((M.need-M.held)/1000))+"s to hold";
    if(M.def.kind==="rescue") sub = M.freed+" / "+M.def.count+" clear";
    if(M.limit)               sub += (sub?" · ":"")+Math.max(0,Math.ceil((M.limit-M.t)/1000))+"s left";
    UX.textAlign = "center";
    UX.font = '700 13px Bungee, sans-serif';
    UX.lineWidth = 4; UX.strokeStyle = "rgba(0,0,0,.8)";
    UX.strokeText(missionTitle(M.def).toUpperCase(), VW/2, 30);
    UX.fillStyle = "#F7BC46"; UX.fillText(missionTitle(M.def).toUpperCase(), VW/2, 30);
    UX.font = '700 11px "Chivo Mono",ui-monospace,monospace';
    const line = (sub ? sub+" · " : "") + d + " m";
    UX.strokeText(line, VW/2, 48); UX.fillStyle = "#D6CEEA"; UX.fillText(line, VW/2, 48);
    /* an arrow at the edge if the marker is off screen */
    if(mk){
      const sc = project(mk.x, 2, mk.z);
      const m2 = 60;
      if(!sc || sc.x<m2 || sc.x>VW-m2 || sc.y<m2 || sc.y>VH-m2){
        let ang;
        if(sc) ang = Math.atan2(sc.y-VH/2, sc.x-VW/2);
        else { const rel = Math.atan2(mk.x-p.x, mk.z-p.z) - G.camYaw;
               ang = Math.atan2(-Math.cos(rel), Math.sin(rel)); }
        const k = Math.min(Math.abs((VW/2-m2)/(Math.cos(ang)||1e-6)), Math.abs((VH/2-m2)/(Math.sin(ang)||1e-6)));
        const px2 = VW/2 + Math.cos(ang)*k, py2 = VH/2 + Math.sin(ang)*k;
        UX.save(); UX.translate(px2,py2); UX.rotate(ang);
        UX.fillStyle = "#F7BC46";
        UX.beginPath(); UX.moveTo(16,0); UX.lineTo(-10,-9); UX.lineTo(-4,0); UX.lineTo(-10,9);
        UX.closePath(); UX.fill(); UX.restore();
      }
    }
  }
  if(G.combo>2){
    UX.globalAlpha = Math.min(1,(G.comboT-G.t)/700);
    UX.font = '700 32px Bungee, sans-serif'; UX.textAlign="center";
    UX.lineWidth=6; UX.strokeStyle="rgba(0,0,0,.75)";
    UX.strokeText(G.combo+" HIT", VW/2, 112);
    UX.fillStyle="#F7BC46"; UX.fillText(G.combo+" HIT", VW/2, 112);
    UX.globalAlpha = 1;
  }
  drawMini();
}

  for(const b of G.world.boxes)
    MCX.fillRect((b.x+WORLD/2-b.w/2)*S2, (b.z+WORLD/2-b.d/2)*S2, Math.max(1,b.w*S2), Math.max(1,b.d*S2));

}

  KeyW:"up", ArrowUp:"up", KeyS:"down", ArrowDown:"down", KeyA:"left", ArrowLeft:"left",
  KeyD:"right", ArrowRight:"right", KeyZ:"light", KeyJ:"light", KeyX:"power", KeyK:"power",

  if(ev.repeat) return;
  if(KEYMAP[ev.code]){ input[KEYMAP[ev.code]] = 1; ev.preventDefault(); }
  if(ev.code==="ShiftLeft" || ev.code==="ShiftRight"){ input.fly = 1; input.dodge = 1; ev.preventDefault(); }
  if(ev.code==="KeyQ") input.surgeGo = true;
  if(ev.code==="KeyT"){ toggleLock(); }
  if(ev.code==="KeyB" || ev.code==="Tab"){ ev.preventDefault(); openBodyPicker(); }
  if(ev.code==="Escape"||ev.code==="KeyP"){
    if(document.pointerLockElement) document.exitPointerLock();
    SCREENS.firstChild ? closeScreen() : openScreen("pause");
  }
});
addEventListener("keyup", ev=>{
  if(KEYMAP[ev.code]) input[KEYMAP[ev.code]] = 0;

const stick = {on:false, id:-1, cx:0, cy:0, dx:0, dy:0};
const look  = {on:false, id:-1, x:0, y:0};
function readMove(){
  if(stick.on) return {x:stick.dx, y:-stick.dy};
  let x = (input.right?1:0)-(input.left?1:0), y = (input.up?1:0)-(input.down?1:0);
  const m = Math.hypot(x,y); if(m>1){ x/=m; y/=m; }
  return {x,y};
}

UI.addEventListener("pointerdown", ev=>{
  audioInit();
  touchMode(ev.pointerType!=="mouse");
  if(SCREENS.firstChild) return;
  if(ev.pointerType==="mouse" && ev.button===2){ input.block = 1; ev.preventDefault(); return; }
  if(ev.pointerType!=="mouse" && ev.clientX < VW*0.5 && !stick.on){
    stick.on = true; stick.id = ev.pointerId; stick.cx = ev.clientX; stick.cy = ev.clientY;
    showStick(ev.clientX, ev.clientY);
    UI.setPointerCapture(ev.pointerId);
  } else if(!look.on){
    look.on = true; look.id = ev.pointerId; look.x = ev.clientX; look.y = ev.clientY;
    UI.setPointerCapture(ev.pointerId);
    if(ev.pointerType==="mouse" && CV.requestPointerLock && !document.pointerLockElement) CV.requestPointerLock();
  }
  ev.preventDefault();
});
UI.addEventListener("pointermove", ev=>{
  if(stick.on && ev.pointerId===stick.id){
    let dx = ev.clientX-stick.cx, dy = ev.clientY-stick.cy;
    const max = 58, d = Math.hypot(dx,dy);
    if(d>max){ dx = dx/d*max; dy = dy/d*max; }
    NUB.style.transform = `translate(${dx}px,${dy}px)`;
    const mag = Math.min(1, d/max);
    if(mag < .16){ stick.dx = stick.dy = 0; }
    else { const n = d||1; stick.dx = dx/n*mag; stick.dy = dy/n*mag; }
  } else if(look.on && ev.pointerId===look.id && !document.pointerLockElement){
    G.camYaw   -= (ev.clientX-look.x)*0.006;
    G.camPitch = clamp(G.camPitch + (ev.clientY-look.y)*0.005, -0.45, 1.15);
    look.x = ev.clientX; look.y = ev.clientY;
  }
});

  if(ev.button===2) input.block = 0;
  if(stick.on && ev.pointerId===stick.id){ stick.on=false; stick.dx=stick.dy=0; hideStick(); }
  if(look.on && ev.pointerId===look.id) look.on = false;
};

/* Becoming somebody else. Free whenever you are not in a fight. */
function canBecome(){
  if(!G.world || G.ended) return false;
  return !inCombat();
}
function becomeHost(id){
  if(!BY_ID[id] || !S.unlocked.includes(id)) return false;
  if(id === S.host) return false;
  if(!canBecome()){
    feed("You cannot let go of a body mid-fight — break away first", "");
    return false;
  }
  const old = G.player;
  S.host = id; save();
  if(old){
    shock(old.x, old.y+0.9, old.z, 3.2, GOLD3, 520);
    burst(old.x, old.y+0.9, old.z, 26, old.pal.c3);
  }
  syncHostLive();
  if(!G.player) buildHost();
  if(G.player){
    setFx(G.player, "iframe", 1200);
    G.player.hp = G.player.maxHp;
    shock(G.player.x, G.player.y+0.9, G.player.z, 4.0, G.player.pal.c3, 620);
    SFX.become();
    feed((old ? "You let go of "+old.b.name+" and take " : "You take ") + G.player.b.name, "big");
  }
  buildHostHud();
  return true;
}

  el("tag-foes").textContent = sectorCleared(G.sector) ? "SECTOR CLEAR"
    : G.bossEnt && !G.bossEnt.dead ? "BOSS · "+G.bossEnt.b.name.toUpperCase()

  document.querySelectorAll("#pad .abtn").forEach(btn=>{
    const slot = btn.dataset.ab;
    const {a,name} = abilityOf(p, slot);
    const key = {light:"Z",power:"X",util:"C",ult:"V"}[slot];
    const short = name.length>12 ? name.split(" ")[0] : name;
    el("lab-"+slot).innerHTML = short + `<small>${key}${a.cost?" · "+a.cost:""}</small>`;
    const left = Math.max(0, (p.cds[slot]||0) - G.t);
    btn.querySelector(".cool").style.transform = `scaleY(${Math.max(0,Math.min(1,left/a.cd))})`;
    btn.disabled = p.nrg < (a.cost||0);
  });
  FLYB.style.display = p.canFly ? "" : "none";
  FLYB.dataset.on = p.fly ? "1":"0";
  DODGEB.style.display = p.canFly ? "none" : "";
  DODGEB.dataset.on = (p.rollCd||0) > G.t ? "0" : "1";
  el("btn-block").dataset.on = p.blocking ? "1":"0";
  el("btn-lock").dataset.on = G.lockTarget ? "1":"0";
  el("btn-surge").dataset.on = G.surge>=100 ? "1":"0";
  const lock = el("tag-combat");
  if(inCombat()){ lock.style.display = ""; lock.textContent = "IN COMBAT · "+combatLeft()+"s"; }
  else lock.style.display = "none";
  const become = el("hud-squad").firstChild;
  if(become){
    become.dataset.on = canBecome() ? "1" : "0";
    become.querySelector("b").textContent = canBecome() ? "BECOME" : "LOCKED";
  }
  if(faceId !== p.id){ faceId = p.id; drawPortrait(el("face"), p.b); }
}

/* a small portrait for the menus, from the same palette the body uses */
function drawPortrait(cv, b){
  const g = cv.getContext("2d"), w = cv.width, h = cv.height;
  const pal = palette(b);
  const px = c => `rgb(${Math.round(Math.pow(Math.min(1,c[0]),1/2.2)*255)},${Math.round(Math.pow(Math.min(1,c[1]),1/2.2)*255)},${Math.round(Math.pow(Math.min(1,c[2]),1/2.2)*255)})`;
  const u = w/100;
  g.clearRect(0,0,w,h);
  const bg = g.createLinearGradient(0,0,0,h);
  bg.addColorStop(0, px(pal.dark)); bg.addColorStop(1, "#0A0912");
  g.fillStyle = bg; g.fillRect(0,0,w,h);
  if(pal.cape){ g.fillStyle = px(pal.capeCol);
    g.beginPath(); g.moveTo(12*u,100*u); g.lineTo(24*u,52*u); g.lineTo(76*u,52*u); g.lineTo(88*u,100*u);
    g.closePath(); g.fill(); }
  /* shoulders */
  g.fillStyle = px(pal.c1);
  g.beginPath();
  g.moveTo(18*u,100*u); g.quadraticCurveTo(22*u,62*u, 50*u,60*u);
  g.quadraticCurveTo(78*u,62*u, 82*u,100*u); g.closePath(); g.fill();
  /* chest mark */
  g.fillStyle = px(pal.c3); g.fillRect(43*u, 74*u, 14*u, 12*u);
  /* neck */
  g.fillStyle = px(pal.masked||pal.machine ? pal.c1 : pal.skin);
  g.fillRect(44*u, 52*u, 12*u, 12*u);
  /* head */
  g.beginPath(); g.ellipse(50*u, 38*u, 19*u, 22*u, 0, 0, 6.2832); g.fill();
  if(!pal.masked && !pal.machine){
    g.fillStyle = px(pal.hair);
    g.beginPath(); g.ellipse(50*u, 26*u, 20*u, 13*u, 0, Math.PI, 0); g.fill();
  }
  if(pal.masked || pal.machine){
    g.fillStyle = px(pal.c3); g.fillRect(36*u, 34*u, 28*u, 7*u);
  } else {
    g.fillStyle = "#0B0A14";
    g.beginPath(); g.ellipse(43*u,37*u,3*u,2.4*u,0,0,6.2832); g.fill();
    g.beginPath(); g.ellipse(57*u,37*u,3*u,2.4*u,0,0,6.2832); g.fill();
  }
  if(pal.horns){ g.fillStyle = px(pal.c3);
    g.beginPath(); g.moveTo(34*u,24*u); g.lineTo(27*u,6*u); g.lineTo(42*u,19*u); g.closePath(); g.fill();
    g.beginPath(); g.moveTo(66*u,24*u); g.lineTo(73*u,6*u); g.lineTo(58*u,19*u); g.closePath(); g.fill(); }
  g.strokeStyle = "rgba(0,0,0,.5)"; g.lineWidth = 2; g.strokeRect(1,1,w-2,h-2);
}

/* ---------------------------------------------------------------- screens */
const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let menuTab = "body";
let bx = {q:"", tag:"all", sector:"all", sort:"tier", cap:150};
let cx = {q:"", cat:"beings", tag:"all", sector:"all", cap:120};

function portraitTags(html){ return html; }
function paintPortraits(root){
  root.querySelectorAll("canvas[data-being]").forEach(c=>{
    const b = BY_ID[c.dataset.being]; if(b) drawPortrait(c, b);
  });
  root.querySelectorAll("canvas[data-glyph]").forEach(c=>{
    const g = c.getContext("2d"), w=c.width, h=c.height, col=c.dataset.col||"#4B4278";
    g.clearRect(0,0,w,h); g.fillStyle = col; g.fillRect(0,0,w,h);
    g.fillStyle = "rgba(0,0,0,.35)";
    for(let i=0;i<w;i+=6) for(let j=0;j<h;j+=6) g.fillRect(i,j,2,2);
    g.fillStyle = "#0B0A14"; g.font = `700 ${Math.round(w*0.42)}px Bungee, sans-serif`;
    g.textAlign="center"; g.textBaseline="middle";
    g.fillText(c.dataset.glyph, w/2, h/2+1);
  });
}
function beingCard(b, extra){
  const owned = S.unlocked.includes(b.id);
  return `<button class="cardb ${owned?"":"locked"}" data-become="${b.id}" ${owned?"":"disabled"}>
    <canvas width="76" height="76" data-being="${b.id}"></canvas>

      <span class="s">T${b.tier} ${esc(ARCH[b.arch].name)}${owned?" · LV "+level(b.id):""}${canFly(b)?" · FLIES":""}</span>
      ${extra||""}

}

function openScreen(name, opts){
  G.paused = true;
  SCREENS.innerHTML = `<div class="screen"><div class="wrap">${screenHtml(name,opts)}</div></div>`;
  paintPortraits(SCREENS);
  SCREENS.scrollTop = 0;
  HUD.classList.add("hide");
}
function closeScreen(){
  if(!SCREENS.firstChild) return;
  SCREENS.innerHTML = "";
  if(S.started && G.world){ G.paused = false; G.last = performance.now(); HUD.classList.remove("hide"); }
}

function screenHtml(name, opts){
  if(name==="title") return titleHtml();
  if(name==="pause") return pauseHtml();
  if(name==="cleared") return clearedHtml();
  if(name==="down") return downHtml();
  return "";
}
