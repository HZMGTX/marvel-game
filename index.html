        <span style="min-width:0;flex:1"><span class="n">${esc(g.name)}</span><br>
        <span class="s">${host&&canEquip(g,id)?(pot===1?"BOUND · FULL":"ECHO · "+Math.round(pot*100)+"%"):"needs "+esc(g.owner)}</span>
        <br><span class="s" style="text-transform:none;letter-spacing:0">${esc(g.move)}</span></span>
      </span>
      <span class="s" style="color:var(--gold)">RANK ${glv}/${GEAR_MAX}${S.attuned.includes(g.id)?" · ATTUNED":` · ${Math.min(kills,attuneNeeded(g.id))}/${attuneNeeded(g.id)} to attune`}</span>
      <span class="row">
        ${ok?`<button class="btn btn--sm ${on?"":"btn--go"}" data-gear="${g.id}">${on?"Carrying":"Carry"}</button>`:""}
        ${glv<GEAR_MAX?`<button class="btn btn--sm" ${canUp?`data-geargrade="${g.id}"`:"disabled"}>Work it · ${gc}</button>`:`<span class="s" style="color:var(--good)">fully worked</span>`}
      </span>
    </div>`;
  };
  const usable = owned.filter(g=>host&&canEquip(g,id));
  const inert  = owned.filter(g=>!host||!canEquip(g,id));
  return `<div class="panel">
    <div class="eyebrow">The rule</div>
    <p class="note" style="margin-top:6px">A suit belongs to a person. To wear it properly you have to <b>be</b> that person.
      Anything else you are carrying sits inert in your hands. Ten kills with a piece while you are its rightful
      owner and it <b>attunes</b> — after that any body can echo it at 55%, which is never the same thing.</p>
    ${locked?`<p class="note" style="color:var(--flare);margin-top:10px"><b>Not mid-fight.</b> You cannot change what you are holding while something is trying to kill you.</p>`:""}
    <div class="row" style="margin-top:10px">
      <span class="eyebrow" style="align-self:center">${host?esc(host.name):"no body"}</span>
      ${host&&!locked?`<button class="btn btn--sm btn--ghost" data-gear="">Carry nothing</button>`:""}
    </div>
  </div>
  ${!host?`<p class="note" style="margin-top:12px">Take a body first.</p>`:""}
  ${usable.length?`<div class="panel" style="margin-top:12px"><div class="eyebrow">Will work in these hands</div>
    <div class="grid grid--wide" style="margin-top:10px">${usable.map(row).join("")}</div></div>`:""}
  ${inert.length?`<div class="panel" style="margin-top:12px"><div class="eyebrow">Held, but inert</div>
    <div class="grid grid--wide" style="margin-top:10px">${inert.map(row).join("")}</div></div>`:""}
  ${!owned.length?`<p class="note" style="margin-top:12px">No gear recovered yet. Beat somebody who owns some — it falls where they do.</p>`:""}`;
}

function mindsTab(){
  const owned = S.aiOwned.map(a=>AI_BY_ID[a]).filter(Boolean);
  const cur = S.installedAi?AI_BY_ID[S.installedAi]:null;
  const host = S.host?BY_ID[S.host]:null;
  const locked = inCombat();
  return `<div class="panel">
    <div class="eyebrow">Installed</div>
    <p class="note" style="margin-top:6px">${cur?`<b>${esc(cur.name)}</b> — ${esc(AI_FX[cur.fx].desc)}`:"Nothing riding along. An artificial mind installs into the vessel, not the body, so it follows you through every swap — but most of them refuse to run on flesh."}</p>
    ${locked?`<p class="note" style="color:var(--flare);margin-top:8px">Not mid-fight.</p>`:""}
    ${cur&&!locked?`<button class="btn btn--sm btn--ghost" style="margin-top:10px" data-ai="">Uninstall</button>`:""}
  </div>
  <div class="panel" style="margin-top:12px">
    <div class="eyebrow">${owned.length} of ${AI_LIST.length} reached — one comes free with every sector you clear</div>
    <div class="grid grid--wide" style="margin-top:10px">
      ${owned.map(a=>{
        const fits = host && aiAllowed(a,host,gearFor(host.id));
        return `<button class="cardb ${locked?"locked":""}" ${locked?"disabled":`data-ai="${a.id}"`} aria-pressed="${cur&&cur.id===a.id}">
          <canvas width="76" height="76" data-glyph="${esc(a.initials)}" data-col="#0E7C78"></canvas>
          <span style="min-width:0"><span class="n">${esc(a.name)}</span><br>
          <span class="s">${esc(AI_FX[a.fx].label)}${host?(fits?" · runs on "+esc(host.name):" · will not run on "+esc(host.name)):""}</span>
          <br><span class="s" style="text-transform:none;letter-spacing:0">${esc(AI_FX[a.fx].desc)}</span></span>
        </button>`;}).join("")}
    </div>
    ${!owned.length?`<p class="note">Clear a sector — kill eight of its locals to draw the boss out, then put the boss down.</p>`:""}
  </div>`;
}

function sectorsTab(){
  return `<div class="panel"><div class="eyebrow">Thirty places</div>
    <p class="note" style="margin-top:6px">Clear one and the next opens. Everything you beat anywhere stays yours.</p></div>
    <div class="grid grid--wide" style="margin-top:12px">
    ${SECTORS.map((s,i)=>{
      const open = sectorUnlocked(s.id), done = sectorCleared(s.id);
      const boss = sectorBoss(s.id);
      return `<button class="cardb ${open?"":"locked"}" ${open?`data-sector="${s.id}"`:"disabled"}
        style="flex-direction:column;align-items:flex-start;gap:4px" aria-pressed="${G.sector===s.id}">
        <span class="s">Sector ${String(i+1).padStart(2,"0")}${done?" · CLEAR":open?"":" · SEALED"}</span>
        <span class="n" style="font-size:13px">${esc(s.name)}</span>
        <span class="s" style="text-transform:none;letter-spacing:0;color:var(--muted)">${esc(s.blurb)}</span>
        <span class="s">${sectorBeings(s.id).length} beings · boss: ${esc(boss.name)}</span>
        <span class="s">${killsIn(s.id)}/${KILLS_TO_BOSS} beaten here</span>
      </button>`;}).join("")}</div>`;
}

const ALL_TAGS = (()=>{const s=new Set(); BEINGS.forEach(b=>b.tags.forEach(t=>s.add(t))); return [...s].sort();})();
function codexTab(){
  const q = cx.q.trim().toLowerCase();
  let items, cells;
  if(cx.cat==="beings"){
    items = BEINGS.filter(b=>(!q||b.name.toLowerCase().includes(q)||b.tags.join(" ").includes(q)||ARCH[b.arch].name.toLowerCase().includes(q))
      && (cx.tag==="all"||b.tags.includes(cx.tag)) && (cx.sector==="all"||b.sector===cx.sector))
      .sort((a,b)=>b.tier-a.tier||a.name.localeCompare(b.name));
    cells = items.slice(0,cx.cap).map(b=>{
      const g = GEAR_BY_OWNER[b.id]||[];
      return `<button class="cardb ${S.unlocked.includes(b.id)?"":"locked"}" data-become="${b.id}" ${S.unlocked.includes(b.id)?"":"disabled"}>
        <canvas width="76" height="76" data-being="${b.id}"></canvas>
        <span style="min-width:0"><span class="n">${esc(b.name)}</span><br>
        <span class="s">T${b.tier} ${esc(ARCH[b.arch].name)} · ${esc(SECTORS[sectorIndex(b.sector)].name)}</span>
        ${g.length?`<br><span class="s" style="color:var(--gold)">${g.map(x=>esc(x.name)).join(", ")}</span>`:""}</span></button>`;}).join("");
  } else if(cx.cat==="gear"){
    items = GEAR_LIST.filter(g=>!q||g.name.toLowerCase().includes(q)||g.owner.toLowerCase().includes(q));
    cells = items.slice(0,cx.cap).map(g=>`<div class="cardb ${S.gearOwned.includes(g.id)?"":"locked"}">
      <canvas width="76" height="76" data-glyph="${esc(g.initials)}" data-col="${g.hue}"></canvas>
      <span style="min-width:0"><span class="n">${esc(g.name)}</span><br>
      <span class="s">${esc(g.owner)}${S.gearOwned.includes(g.id)?" · HELD":""}${S.attuned.includes(g.id)?" · ATTUNED":""}</span>
      <br><span class="s" style="text-transform:none;letter-spacing:0">${esc(g.note)}</span></span></div>`).join("");
  } else if(cx.cat==="minds"){
    items = AI_LIST.filter(a=>!q||a.name.toLowerCase().includes(q));
    cells = items.map(a=>`<div class="cardb ${S.aiOwned.includes(a.id)?"":"locked"}">
      <canvas width="76" height="76" data-glyph="${esc(a.initials)}" data-col="#0E7C78"></canvas>
      <span style="min-width:0"><span class="n">${esc(a.name)}</span><br>
      <span class="s">${esc(AI_FX[a.fx].label)}</span>
      <br><span class="s" style="text-transform:none;letter-spacing:0">${esc(a.note)}</span></span></div>`).join("");
  } else {
    items = SECTORS.filter(s=>!q||s.name.toLowerCase().includes(q));
    cells = items.map(s=>`<div class="cardb"><canvas width="76" height="76" data-glyph="${esc(s.name.slice(0,2).toUpperCase())}" data-col="#2C2270"></canvas>
      <span style="min-width:0"><span class="n">${esc(s.name)}</span><br><span class="s">${sectorBeings(s.id).length} beings</span>
      <br><span class="s" style="text-transform:none;letter-spacing:0">${esc(s.blurb)}</span></span></div>`).join("");
  }
  return `<div class="panel">
    <div class="row">
      <div class="tabs" style="flex:1 1 260px">${["beings","gear","minds","sectors"].map(c=>
        `<button data-cat="${c}" aria-current="${cx.cat===c}">${c}</button>`).join("")}</div>
      <input type="search" id="cxq" placeholder="Search" value="${esc(cx.q)}" style="flex:1 1 160px">
      ${cx.cat==="beings"?`<select id="cxtag"><option value="all">every tag</option>${ALL_TAGS.map(t=>`<option value="${t}" ${cx.tag===t?"selected":""}>${t}</option>`).join("")}</select>
      <select id="cxsec"><option value="all">every sector</option>${SECTORS.map(s=>`<option value="${s.id}" ${cx.sector===s.id?"selected":""}>${esc(s.name)}</option>`).join("")}</select>`:""}
      <span class="mono" style="font-size:11px;color:var(--muted)">${items.length}</span>
    </div>
    <p class="note" style="margin-top:8px">${BEINGS.length} beings · ${GEAR_LIST.length} pieces of gear · ${AI_LIST.length} artificial minds · ${SECTORS.length} sectors. Dimmed means you have not reached it.</p>
  </div>
  <div class="grid grid--wide" style="margin-top:12px">${cells||`<p class="note">Nothing matches that.</p>`}</div>
  ${items.length>cx.cap?`<div class="row" style="justify-content:center;margin-top:14px"><button class="btn btn--sm" data-act="more">Show more</button></div>`:""}`;
}

function rulesTab(){
  return `<div class="panel">${controlsHtml()}</div>
  <div class="panel" style="margin-top:12px">
    <div class="eyebrow">The systems</div>
    <div class="stack" style="margin-top:10px;max-width:66ch">
      <p class="note"><b>Beat somebody, become somebody.</b> Every being you put down joins the list of things you can wear — ${BEINGS.length} of them, from a Hell's Kitchen enforcer to the One Above All.</p>
      <p class="note"><b>Gear belongs to a person.</b> Armour, hammers, symbiotes, cloaks: each is bound to its owner. Become the owner, then equip it. Ten kills as the rightful owner attunes it to the vessel, and after that anyone can echo it at 55%.</p>
      <p class="note"><b>Artificial minds install into you, not the body.</b> Thirty of them. J.A.R.V.I.S. rides in anything with circuitry, Ultron refuses flesh, Cerebro only amplifies a mind that was already reaching.</p>
      <p class="note"><b>Eight locals draws the boss out.</b> Put the boss down and the sector is clear, the next one opens, and a mind comes free.</p>
      <p class="note"><b>Essence and levels.</b> Every kill feeds every host you are carrying. Levels are permanent.</p>
    </div>
    <div class="divider" style="margin:14px 0"></div>
    <div class="eyebrow">Sound</div>
    <p class="note" style="margin:6px 0 10px">Every noise in here is synthesised as it plays — there are no audio files.</p>
    <button class="btn btn--sm ${SND.on?"btn--go":""}" data-act="sound">${SND.on?"On":"Off"}</button>
    <div class="divider" style="margin:14px 0"></div>
    <div class="eyebrow">Picture quality</div>
    <p class="note" style="margin:6px 0 10px">Drop this if the frame rate is uneven. Low turns off shadows and bloom.</p>
    <div class="row">
      ${["high","medium","low"].map(q=>`<button class="btn btn--sm ${quality===q?"btn--go":""}" data-quality="${q}">${q}</button>`).join("")}
    </div>
    <div class="divider" style="margin:14px 0"></div>
    <div class="row" style="margin-top:4px">
      <button class="btn btn--sm" data-act="export">Copy save code</button>
      <button class="btn btn--sm" data-act="import">Paste save code</button>
      <button class="btn btn--sm btn--ghost" data-act="wipe">Erase everything</button>
    </div>
  </div>`;
}

function clearedHtml(){
  const i = sectorIndex(G.sector), nxt = SECTORS[i+1];
  return `<div class="stack" style="max-width:640px;margin:6vh auto 0">
    <div class="eyebrow">Sector clear</div>
    <h2 class="t">${esc(SECTORS[i].name)} is yours</h2>
    ${STORY[G.sector]?`<p class="note" style="font-style:italic;color:var(--ink);margin:10px 0;max-width:56ch">${esc(STORY[G.sector])}</p>`:""}
    <p class="note">${S.unlocked.length} hosts reached · ${S.gearOwned.length} pieces of gear · ${S.aiOwned.length} minds · ${S.essence} essence.</p>
    <div class="row">
      ${nxt?`<button class="btn btn--go" data-sector="${nxt.id}">Move on to ${esc(nxt.name)}</button>`:`<p class="note">There is nothing above this one.</p>`}
      <button class="btn" data-act="close">Stay here</button>
      <button class="btn btn--sm btn--ghost" data-tab="body">Take a different body</button>
    </div>
  </div>`;
}
function downHtml(){
  return `<div class="stack" style="max-width:600px;margin:8vh auto 0">
    <div class="eyebrow">Every host you brought has fallen</div>
    <h2 class="t">You do not die. You lose the grip.</h2>
    <p class="note">The spark comes loose and drifts back to the middle of the sector. The body you were wearing gets up at
      half strength, and it costs you a little of what you have gathered. The fight is over, so you may take a
      different one instead.</p>
    <div class="row">
      <button class="btn btn--go" data-act="revive">Take hold again</button>
      <button class="btn" data-tab="body">Take a different body</button>
    </div>
  </div>`;
}
/* ---------------------------------------------------------------- actions */
SCREENS.addEventListener("click", ev=>{
  const t = ev.target.closest("[data-act],[data-tab],[data-become],[data-gear],[data-ai],[data-sector],[data-start],[data-cat],[data-quality],[data-mission],[data-abil],[data-vessel],[data-geargrade]");
  if(!t) return;
  audioInit(); SFX.ui();
  const d = t.dataset;

  if(d.start){
    S.started = true;
    S.unlocked = [d.start,"hand-assassin","turk-barrett"].filter(x=>BY_ID[x]);
    S.host = d.start;
    (GEAR_BY_OWNER[d.start]||[]).forEach(g=>S.gearOwned.push(g.id));
    save();
    enterSector("hk"); closeScreen();
    feed("You are inside somebody. Try not to enjoy it.","big");
    return;
  }
  if(d.act==="continue"){ enterSector(S.sector||"hk"); closeScreen(); return; }
  if(d.act==="close"){ closeScreen(); return; }
  if(d.act==="abandon"){ abandonMission(); openScreen("pause"); return; }
  if(d.act==="sound"){ audioToggle(); openScreen("pause"); return; }
  if(d.abil){ upgradeAbility(S.host, d.abil); openScreen("pause"); return; }
  if(d.vessel){ upgradeVessel(d.vessel); openScreen("pause"); return; }
  if(d.geargrade){ upgradeGear(d.geargrade); openScreen("pause"); return; }
  if(d.mission){
    const m = missionOffers(G.sector).find(x=>x.id===d.mission);
    if(m){ startMission(m); closeScreen(); }
    return;
  }
  if(d.act==="revive"){ reviveHost(); closeScreen(); return; }
  if(d.act==="more"){ cx.cap += 200; openScreen("pause"); return; }
  if(d.act==="more-bodies"){ bx.cap += 200; openScreen("pause"); return; }
  if(d.act==="wipe"){
    if(t.dataset.confirm==="1"){
      S = clone(DEFAULT_STATE); try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
      G.world = null; SCREENS.innerHTML=""; boot(); return;
    }
    t.dataset.confirm = "1"; t.textContent = "Really erase everything?"; return;
  }
  if(d.act==="export"){
    const code = btoa(unescape(encodeURIComponent(JSON.stringify(S))));
    navigator.clipboard && navigator.clipboard.writeText(code);
    const box = document.createElement("textarea");
    box.value = code; box.readOnly = true;
    box.style.cssText = "width:100%;height:140px;margin-top:10px;background:var(--panel-2);color:var(--ink);border:2px solid var(--line);font-family:var(--f-mono);font-size:10px;padding:8px";
    t.parentNode.parentNode.appendChild(box); box.select();
    return;
  }
  if(d.act==="import"){
    const v = prompt("Paste your save code");
    if(!v) return;
    try{
      S = Object.assign(clone(DEFAULT_STATE), JSON.parse(decodeURIComponent(escape(atob(v.trim())))));
      S.unlocked = S.unlocked.filter(id=>BY_ID[id]); save();
      G.world = null; SCREENS.innerHTML=""; boot();
    }catch(e){ alert("That did not read as a save code."); }
    return;
  }
  if(d.quality){ quality = d.quality; try{ localStorage.setItem(SAVE_KEY+"/q", quality); }catch(e){}
    resize(); if(G.world) setWeather(G.weather); openScreen("pause"); return; }
  if(d.tab){ menuTab = d.tab; openScreen("pause"); return; }
  if(d.cat){ cx.cat = d.cat; cx.cap = 120; openScreen("pause"); return; }
  if(d.become){
    if(becomeHost(d.become)) closeScreen();
    else openScreen("pause");
    return;
  }
  if(d.gear!==undefined){
    if(inCombat()){ openScreen("pause"); return; }
    const id = S.host;
    if(id){ if(d.gear) S.loadout[id] = d.gear; else delete S.loadout[id]; save(); syncHostLive(); }
    openScreen("pause"); return;
  }
  if(d.ai!==undefined){
    if(inCombat()){ openScreen("pause"); return; }
    S.installedAi = d.ai || null; save(); syncHostLive(); openScreen("pause"); return;
  }
  if(d.sector){
    if(!sectorUnlocked(d.sector)) return;
    enterSector(d.sector); closeScreen(); return;
  }
});
function reopenKeeping(id){
  const el0 = document.getElementById(id);
  const sel = el0 ? el0.selectionStart : 0;
  openScreen("pause");
  const n = document.getElementById(id);
  if(n){ n.focus(); if(n.setSelectionRange) n.setSelectionRange(sel,sel); }
}
SCREENS.addEventListener("input", ev=>{
  if(ev.target.id==="cxq"){ cx.q = ev.target.value; cx.cap = 120; reopenKeeping("cxq"); }
  if(ev.target.id==="bxq"){ bx.q = ev.target.value; bx.cap = 150; reopenKeeping("bxq"); }
});
SCREENS.addEventListener("change", ev=>{
  const t = ev.target;
  if(t.id==="cxtag"){ cx.tag = t.value; openScreen("pause"); }
  if(t.id==="cxsec"){ cx.sector = t.value; openScreen("pause"); }
  if(t.id==="bxtag"){ bx.tag = t.value; openScreen("pause"); }
  if(t.id==="bxsec"){ bx.sector = t.value; openScreen("pause"); }
  if(t.id==="bxsort"){ bx.sort = t.value; openScreen("pause"); }
});


/* ------------------------------------------------------------------- boot */
function buildHost(){
  const w = G.world;
  G.ents = G.ents.filter(e=>e.team!=="you");
  G.player = (S.host && BY_ID[S.host]) ? makeEnt(S.host, w.cx, w.cz, "you", {}) : null;
  if(G.player) G.ents.push(G.player);
  buildHostHud();
}
function enterSector(id){
  G.sector = id; S.sector = id;
  G.world = buildWorld(id);
  G.ents = []; G.projs = []; G.parts = []; G.pops = []; G.beams = [];
  G.rings = []; G.arcs = []; G.orbits = []; G.drops = [];
  G.bossEnt = null; G.surge = 0; G.combo = 0; G.ended = false; G.spawnT = 900;
  G.mission = null; G.lockTarget = null; G.freeze = 0; G.lastCombat = -1e9;
  G.cars = []; G.rain = [];
  buildHost();
  G.camYaw = 0; G.camPitch = 0.26;
  rollWeather();
  spawnTraffic(Math.round(WORLD/34));
  spawnAmbientCivs(6);
  for(let i=0;i<5;i++) spawnWanderer();
  if(bossReady(id) && !sectorCleared(id)) spawnBoss();
  save();
  feed(SECTORS[sectorIndex(id)].name.toUpperCase(),"big");
}
function reviveHost(){
  buildHost();
  if(G.player){
    G.player.hp = G.player.maxHp*0.5;
    setFx(G.player,"iframe",2000);
  }
  S.essence = Math.max(0, Math.round(S.essence*0.85));
  G.ended = false; G.surge = 0; G.lastCombat = -1e9;
  save();
}
/* rebuild the live body after a gear or mind change, keeping health and place */
function syncHostLive(){
  if(!G.world || !G.player) return;
  const old = G.player;
  const frac = old.hp/old.maxHp;
  const px = old.x, py = old.y, pz = old.z, yaw = old.yaw, fly = old.fly;
  buildHost();
  if(G.player){
    G.player.x = px; G.player.y = py; G.player.z = pz; G.player.yaw = yaw;
    G.player.fly = fly && G.player.canFly;
    G.player.hp = Math.max(1, Math.round(G.player.maxHp*frac));
  }
}

function frame(ts){
  requestAnimationFrame(frame);
  let dt = Math.min(50, ts - (G.last||ts));
  G.last = ts;
  if(!G.world) return;
  /* hit-stop: a heavy landing freezes the world for a breath */
  if(G.freeze > 0){ G.freeze -= dt; dt *= 0.08; }
  if(!G.paused) update(dt);
  renderScene();
  updateHud();
  audioTick();
}

function boot(){
  try{ const q = localStorage.getItem(SAVE_KEY+"/q"); if(q && QUALITY[q]) quality = q; }
  catch(e){}
  if(!localStorage.getItem(SAVE_KEY+"/q") && (matchMedia("(pointer: coarse)").matches || innerWidth < 760)) quality = "medium";
  resize();
  load();
  if(!S.started) openScreen("title");
  else {
    if(!S.host) S.host = S.unlocked[0] || "daredevil";
    enterSector(S.sector||"hk");
    openScreen("title");
  }
}
boot();
requestAnimationFrame(frame);

</script>
