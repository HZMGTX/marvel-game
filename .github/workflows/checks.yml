# The regression harness drives the real game in a real browser.
#
# This is deliberately manual — Run workflow, from the Actions tab. On push and
# pull_request it fired and failed in two seconds with no logs at all, which is
# what GitHub Actions does on a private repository when it cannot start a runner
# (no included minutes left, a spending limit, or Actions restricted for the
# repo). A check that is permanently red without ever running the tests is worse
# than no check, so it waits to be asked. Turn the triggers back on once Actions
# can run here — nothing else about it needs to change.
name: checks

on:
  workflow_dispatch:

jobs:
  regress:
    name: 77 checks, in a real browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Get a browser
        run: npx playwright install --with-deps chromium

      - name: Syntax-check every source file
        run: |
          for f in $(git ls-files 'src/**/*.js' 'test/*.js' 'tools/*.js'); do
            node --check "$f" || exit 1
          done

      - name: Fold it into one file
        run: node tools/bundle.js

      - name: Drive the split build
        run: node test/regress.js

      - name: Drive the single-file bundle
        run: node test/regress.js
        env:
          GAME_URL: file://${{ github.workspace }}/dist/multiverse-vessel.html

      - name: Keep the bundle if anything failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: multiverse-vessel
          path: dist/multiverse-vessel.html
          if-no-files-found: ignore
